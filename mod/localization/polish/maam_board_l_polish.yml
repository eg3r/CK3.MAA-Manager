l_polish:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high Kwatermistrz#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high Ustawienia panelu#! · Domyślny widok po otwarciu okna wojska."
 MAAM_S_RT:0 "Przeszkalanie: $MAAM_RT_SRC$. Wybierz nowy typ po lewej."
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$Trwa wojna."
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$Wystawiono armię."
 MAAM_S_LIFT:0 "Wzięto stos z pułku $MAAM_OB_SRC$. Kliknij Umieść na zielonym pułku."
 MAAM_S_ENDED:0 "Z pułku $MAAM_OB_SRC$ został tylko ostatni stos."
 MAAM_S_ENDED_TT:0 "Z pułku $MAAM_OB_SRC$ został tylko ostatni stos. Pułki, które mogą go przyjąć, mają czerwony przycisk Scal tutaj; Gotowe zostawia go jako osobny pułk."
 MAAM_S_MERGE:0 "Scalanie ostatniego stosu pułku $MAAM_OB_SRC$."
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · stosy [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] · [soldiers|E] [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount]#!"
 MAAM_S_SEL_TT:0 "Wybrano pułk $MAAM_OB_SEL$, a jego okno jest otwarte po lewej. Działania są poniżej; kliknij kafelek ponownie lub ×, aby odznaczyć."
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$: miejsce na jeszcze [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]."
 MAAM_S_GROW_TT:0 "Pułk $MAAM_QM_A$ ma miejsce na kolejne stosy: [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]. Okno pułku pokaże, czy możesz go teraz powiększyć."
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$$MAAM_QM_A$: dwa pułki zmieszczą się w jednym."
 MAAM_S_COMBINE_TT:0 "Wszystkie miejsca na pułki są zajęte, a dwa pułki takie jak $MAAM_QM_A$ zmieszczą się w jednym. Połączenie zwalnia miejsce; dopóki nie zajmiesz go nowym pułkiem, twoja armia jest mniejsza. Przycisk Pokaż podświetla oba."
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak Kliknij pionek, aby wziąć stos.#!"
 MAAM_S_IDLE_TT:0 "Kliknij pionek stosu, aby go wziąć, a potem kliknij Umieść na podświetlonym na zielono pułku tego samego typu. Dzięki przyciskowi ze strzałkami na końcu wiersza pułku [soldiers|E] mogą przechodzić między pułkami tego samego typu."
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak Kliknij pułk, aby go wybrać.#!"
 MAAM_S_IDLE_TILES_TT:0 "Kliknij pułk, aby go wybrać: po lewej otworzy się jego okno, a przyciski poniżej będą działać na niego. Przycisk Zapytaj ponownie przegląda twoje pułki w poszukiwaniu rad."
 MAAM_S_IDLE_TITLE:0 "#weak Kliknij pionek, aby przenieść stos w obrębie tytułu.#!"
 MAAM_S_IDLE_TITLE_TT:0 "Kliknij pionek stosu, aby go wziąć, a potem kliknij Umieść na podświetlonym na zielono pułku tego samego typu i tytułu. Dzięki przyciskowi ze strzałkami na końcu wiersza pułku [soldiers|E] mogą przechodzić między pułkami."
 MAAM_S_RES_RETRAINED:0 "@check_icon! Pułk [GetVariableSystem.Get( 'maam_rt_old_name' )] przeszkolono na $MAAM_RT_NEW$ za $MAAM_RT_P_RES$"
 MAAM_S_RES_FAILED:0 "#X Nie przeszkolono pułku [GetVariableSystem.Get( 'maam_rt_old_name' )].#! Nic nie wydano."

 # Strip, row 2
 MAAM_S_RT_L:0 "1 miejsce zarezerwowane i pułki zablokowane do końca."
 MAAM_S_BLK_L:0 "Stosy, [soldiers|E] i przeszkalanie czekają, aż zawrzesz pokój i rozwiążesz wszystkie armie."
 MAAM_S_LIFT_L:0 "Jeden stos na kliknięcie."
 MAAM_S_ENDED_L:0 "Scalenie rozwiązuje pułk. Nieodwracalne."
 MAAM_S_MERGE_L:0 "Scalenie go rozwiąże. Scal tutaj mają pułki, które mogą go przyjąć."
 MAAM_S_RES_DONE_L:0 "Wielkość i [soldiers|E] bez zmian. Nowy pułk stoi tam, gdzie gra dodaje nowe pułki."
 MAAM_S_RES_FAILED_L:0 "Wszystko kupione tym kliknięciem usunięto i zwrócono."
 MAAM_PREF_LIST:0 "Lista"
 MAAM_PREF_GROUPED:0 "Grupy"
 MAAM_PREF_TILES:0 "Kafelki"
 MAAM_PREF_SAVED:0 "Zapisywane z grą."
 MAAM_BACK:0 "Cofnij stos ([GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0])"
 MAAM_BACK_TT:0 "Przenosi ostatnio umieszczony stos z powrotem do pułku, z którego go wzięto. Kliknij ponownie, aby cofnąć wcześniejsze umieszczenia z tego pułku (do 10)."
 MAAM_DONE:0 "Gotowe"
 MAAM_CANCEL:0 "Anuluj"
 MAAM_PUT_DOWN:0 "Odłóż"
 MAAM_PUT_DOWN_TT:0 "Kończy przenoszenie stosów. Umieszczone już stosy zostają na miejscu."
 MAAM_ENDED_DONE_TT:0 "Zostawia ostatni stos jako osobny pułk."
 MAAM_KEEP_IT:0 "Zostaw"
 MAAM_KEEP_IT_TT:0 "Zostawia pułk. Nic nie zostaje scalone."
 MAAM_DESELECT_TT:0 "Odznacz (zamyka okno pułku)"
 MAAM_DISMISS_TT:0 "Zamknij"
 MAAM_RT_CANCEL_TT:0 "Kończy przeszkalanie. Nic nie kupiono ani nie zatrzymano, więc nic nie zostanie wydane."

 # Moving soldiers
 MAAM_POUR_TT:0 "#T Przenieś ludzi#!\nŁączy ten pułk w parę z innym tego samego typu. Za każdym kliknięciem [soldiers|E] – najwyżej jeden stos – od razu przechodzą w jedną lub drugą stronę; pierwszy stos zawsze zostaje pełny."
 MAAM_S_POUR_NONE:0 "Żaden inny pułk tego typu nie może teraz wziąć udziału."
 MAAM_S_POUR_NONE_L:0 "Przenoszenie ludzi wymaga drugiego pułku tego samego typu."
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "Wyślij z pułku [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] do pułku [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] – [soldiers|E]: [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )].\n#weak Najwyżej jeden stos na kliknięcie; pułk wysyłający zachowuje pełny pierwszy stos.#!"
 MAAM_POUR_TAKE_TT:0 "Wyślij z pułku [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] do pułku [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] – [soldiers|E]: [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )].\n#weak Najwyżej jeden stos na kliknięcie; pułk wysyłający zachowuje pełny pierwszy stos.#!"
 MAAM_POUR_NONE_TT:0 "#X W tę stronę nic nie przejdzie#!\nPułk wysyłający zachowuje pełny pierwszy stos, a przyjmujący potrzebuje miejsca."
 MAAM_POUR_PREV_TT:0 "Sparuj z poprzednim pułkiem tego typu"
 MAAM_POUR_NEXT_TT:0 "Sparuj z następnym pułkiem tego typu"
 MAAM_POUR_BAR_TT:0 "#weak Niebieski: pierwszy stos, który zostaje · złoty: [soldiers|E], którzy mogą przejść · czerwony: wolne miejsce#!"
 MAAM_POUR_DONE_TT:0 "Kończy przenoszenie ludzi. Wszystkie ruchy już się odbyły."

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T Wielkość [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E] [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak Flaga to sztandar, każdy kwadrat to jeden stos. Złoty: [soldiers|E] · czerwony: brakujący [soldiers|E] · pusty: miejsce na kolejny stos.#!"
 MAAM_LANE_TITLE_TT:0 "Tytuł posiadający: [Regiment.GetOwningTitle.GetName]\nTytuł kontrolujący: [Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I Kliknij nazwę, aby otworzyć okno pułku#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak Zablokowane w trakcie przeszkalania.#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T Przeszkalanie#!\nTen pułk jest przeszkalany w zbrojowni."
 MAAM_BADGE_LOANED_TT:0 "#T Wypożyczony#!\nWypożyczony tytułowi [Regiment.GetControllingTitle.GetNameNoTooltip]. Zmiany poczekają na jego powrót."
 MAAM_BADGE_UNRAISED_TT:0 "#T Niewystawiony#!\nTrwa wojna, a ten pułk nie jest wystawiony."
 MAAM_BADGE_UNSTATIONED_TT:0 "#T Nie stacjonuje#!\nTen pułk nigdzie nie stacjonuje, choć masz prowincje, w których mógłby stacjonować."
 MAAM_TT_RETRAINING:0 "@alert_icon! #high Przeszkalany#! w zbrojowni"
 MAAM_TT_LOANED:0 "@alert_icon! #high Wypożyczony#! tytułowi [Regiment.GetControllingTitle.GetNameNoTooltip]"
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\nSztandar: pierwszy stos pułku. Nigdy nie przenosi się osobno; Scal ostatni stos scala cały pułk z innym."
 MAAM_PIECE_LIFT_TT:0 "Weź stos, a potem kliknij Umieść na podświetlonym pułku tego samego typu."
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "Odłóż stos"
 MAAM_PIECE_PLACE_TT:0 "Umieść tu jeden stos"
 MAAM_PLACE:0 "Umieść"
 MAAM_PLACE_TT:0 "Przenosi do tego pułku jeden stos, a z nim [soldiers|E] (najwyżej jeden stos). Działa od razu."
 MAAM_MERGE_HERE:0 "Scal tutaj"
 MAAM_MERGE_HERE_TT:0 "#X Scal#!\nOstatni stos i wszyscy jego [soldiers|E] dołączają do tego pułku, a drugi pułk zostaje rozwiązany.\n\n#weak Tego nie można cofnąć.#!"
 MAAM_LOWER_TT:0 "#X Scal ostatni stos#!\nScala ten pułk z innym pułkiem tego samego typu. Pułki, które mogą go przyjąć, pokazują Scal tutaj."
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E]: [Regiment.CalcMenAliveCount] z [Regiment.GetMaxCount]\n#weak Złoty: żołnierze · czerwony: brakujący. Pełny pasek = pełne siły przy tej wielkości.#!"
 MAAM_BLOCKED_TT:0 "#X Nie teraz#!\nStosy, [soldiers|E] i przeszkalanie czekają, aż zawrzesz pokój i rozwiążesz wszystkie armie."
 MAAM_RETRAIN_TT:0 "Przeszkol na inny typ. Otwiera zbrojownię: kliknij typ, aby zobaczyć dokładną opłatę, a potem naciśnij Przeszkol."
 MAAM_RETRAIN_BLOCKED_TT:0 "#X Nie można teraz przeszkolić tego pułku#!\nMusi być twój, pod twoją kontrolą i niewystawiony. Musisz być w stanie pokoju, bez wystawionych armii, a żadne inne przeszkalanie nie może być otwarte."
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "Najpierw zamknij okno rekrutacji."
 MAAM_RETRAIN_TITLE_TT:0 "#X Niedostępne#!\nPułków zbrojnych tytułu nie można jeszcze przeszkolić w zbrojowni."
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X Niedostępne#!\nPrzeszkalanie wymaga pokoju i braku wystawionych armii."
 MAAM_SEL_LIFT:0 "Weź stos"
 MAAM_SEL_POUR:0 "Przenieś ludzi"
 MAAM_SEL_RETRAIN:0 "Przeszkol"
 MAAM_SEL_LOWER:0 "Scal ostatni stos"
 MAAM_SEL_LIFT_TT:0 "#T Weź stos#!\nBierze jeden stos; potem kliknij podświetlony na zielono pułk tego samego typu, aby go tam umieścić. Działa od razu."
 MAAM_SEL_LIFT_LONE_TT:0 "#X Został tylko ostatni stos#!\nUżyj Scal ostatni stos, aby scalić go z innym pułkiem tego samego typu."
 MAAM_SEL_BLOCKED_TT:0 "#X Teraz niedostępne dla tego pułku#!"
 MAAM_SEL_NONE_TT:0 "Najpierw wybierz pułk: kliknij jego kafelek."
 MAAM_LOWER_BIG_TT:0 "#X Scal ostatni stos#!\nTylko gdy został jeden stos. Najpierw przenieś pozostałe stosy do pułków tego samego typu."
 MAAM_PAIRED:0 "W parze"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "pułki"
 MAAM_GROUP_REGIMENT:0 "pułk"
 MAAM_GROUP_FOLD_TT:0 "Zwiń lub rozwiń tę grupę"
 MAAM_GROUP_FROZEN_TT:0 "Grupy pozostają bez zmian, dopóki trwa działanie."

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "Lista: kolejność z gry\n#weak Zapamiętane do następnego otwarcia okna wojska.#!"
 MAAM_VIEW_GROUPED_TT:0 "Grupy według typu, z liczbą pułków każdego typu\n#weak Zapamiętane do następnego otwarcia okna wojska.#!"
 MAAM_VIEW_TILES_TT:0 "Kafelki, jak w podstawowej grze\n#weak Zapamiętane do następnego otwarcia okna wojska.#!"
 MAAM_VIEW_LOCKED_TT:0 "Widok nie zmienia się, dopóki trwa działanie."
 MAAM_SETTINGS_TT:0 "Jeszcze niedostępne"

 # Quartermaster
 MAAM_QM_OPEN:0 "Otwórz pułk"
 MAAM_QM_OPEN_TT:0 "Otwiera okno pułku z przyciskiem gry „Zwiększ wielkość”."
 MAAM_QM_SHOW:0 "Pokaż"
 MAAM_QM_SHOW_TT:0 "Podświetla oba pułki."
 MAAM_QM_NEXT:0 "Dalej"
 MAAM_QM_ASK:0 "Zapytaj"
 MAAM_QM_ASK_TT:0 "Ponownie przegląda twoje pułki."
 MAAM_CREATE_BLOCKED_TT:0 "#X Nie podczas przeszkalania#!\nPrzeszkalanie zajmuje tymczasowe miejsce na pułk. Najpierw je zakończ lub anuluj."

 # Armory (recruitment window in retrain mode)
 MAAM_RT_PICKER_TITLE:0 "Przeszkol zbrojnych"
 MAAM_RT_CUR_INFO:0 "Stosy [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] · [Regiment.GetMAAType.GetBaseTypeName]"
 MAAM_RT_CUR_STATIONED:0 "#X Stacjonuje w: [Regiment.GetOriginProvince.GetName]#! – po przeszkoleniu rozmieść go ponownie."
 MAAM_RT_CUR_PRICE:0 " · $MAAM_RT_P_SRC$"
 MAAM_RT_CUR_PRICE_TT:0 "Twoja cena za stos tego typu, odczytana przy otwarciu zbrojowni. Na jej podstawie wylicza się każdą opłatę za przeszkolenie."
 MAAM_RT_CUR_UNLISTED:0 " · #X cena nieznana#!"
 MAAM_RT_CUR_UNLISTED_TT:0 "#T Dlaczego połowa nowej ceny#!\nPo otwarciu (podczas pauzy) zbrojownia odczytuje twoją cenę, kupując jeden stos typu [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] i zwracając koszt. Tym razem było to niemożliwe: typu [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] nie ma teraz na twojej liście rekrutacji (jego wymagania, np. kultura lub innowacja, nie są już spełnione) albo sprawdzenie się nie powiodło. Dlatego opłata wynosi połowę ceny nowego typu."
 MAAM_RT_CUR_REFUSED:0 " · #X niedostępny#!"
 MAAM_RT_CUR_REFUSED_TT:0 "#T Dlaczego połowa nowej ceny#!\nCeny odczytuje się, kupując jeden stos i zwracając koszt tym samym kliknięciem. Gra właśnie odmówiła sprzedaży typu [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip], więc nie ma ceny do odczytania. Dlatego opłata wynosi połowę ceny nowego typu."
 MAAM_RT_CUR_NONGOLD:0 " · #X cena nieznana#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T Dlaczego połowa nowej ceny#!\nCeny odczytuje się, kupując jeden stos i zwracając koszt tym samym kliknięciem. Zakup typu [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] pobrał zarówno złoto, jak i środki ze skarbca, więc nie da się wyodrębnić jego ceny. Dlatego opłata wynosi połowę ceny nowego typu za stos (minimum nadal obowiązuje)."
 MAAM_RT_CUR_ROW:0 "[MenAtArmsType.GetNameNoTooltip] · twój typ, odczyt ceny"
 MAAM_RT_CUR_ROW_TT:0 "Obecny typ twojego pułku. Jego cena jest odczytywana raz, przy otwarciu zbrojowni (podczas pauzy): jeden stos zostaje kupiony i od razu zwrócony, a potem ten wiersz znika."
 MAAM_RT_CUR_UNKNOWN:0 " · #weak odczyt ceny…#!"
 MAAM_RT_CUR_UNKNOWN_TT:0 "Twoja cena za ten typ jest odczytywana raz, przy otwarciu zbrojowni, gdy gra jest wstrzymana. Jeśli się nie pojawia, wstrzymaj grę."
 MAAM_RT_ROLE_ALL:0 "Wszystko"
 MAAM_RT_ROLE_ALL_TT:0 "Pokaż wszystkie typy, na które możesz przeszkolić."
 MAAM_RT_ROLE_TT:0 "Pokaż tylko: [MenAtArmsType.GetBaseTypeName]"
 MAAM_RT_ROLE_ON_TT:0 "Pokaż znów wszystkie typy"
