l_simp_chinese:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high 军需官#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high 面板设置#! · 打开军事窗口时的默认视图。"
 MAAM_S_RT:0 "正在重训$MAAM_RT_SRC$。请在左侧选择新类型。"
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$处于战争中。"
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$有军队已集结。"
 MAAM_S_LIFT:0 "已从$MAAM_OB_SRC$提起一个堆叠。在发绿光的军团上点击“放置”。"
 MAAM_S_ENDED:0 "$MAAM_OB_SRC$只剩最后一个堆叠。"
 MAAM_S_ENDED_TT:0 "$MAAM_OB_SRC$只剩最后一个堆叠。能接收它的军团会显示红色的“合并至此”；“完成”则将其保留为独立军团。"
 MAAM_S_MERGE:0 "正在合并$MAAM_OB_SRC$的最后一个堆叠。"
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · 堆叠[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] · [soldiers|E][GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount]#!"
 MAAM_S_SEL_TT:0 "已选中$MAAM_OB_SEL$，其军团窗口已在左侧打开。可用操作在下方；再次点击卡片或点击×可取消选择。"
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$还可扩充[Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]个堆叠。"
 MAAM_S_GROW_TT:0 "$MAAM_QM_A$还可扩充[Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]个堆叠。其军团窗口会显示你现在能否增加规模。"
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$两个$MAAM_QM_A$军团可并为一个。"
 MAAM_S_COMBINE_TT:0 "所有栏位均已占用，而两个$MAAM_QM_A$军团可并为一个。合并会空出一个栏位；在你用新军团填补它之前，你的军队规模会变小。“指给我看”会高亮这两个军团。"
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak 点击方格以提起一个堆叠。#!"
 MAAM_S_IDLE_TT:0 "点击堆叠方格将其提起，再在发绿光的同类型军团上点击“放置”。军团行末的箭头按钮可在同类型军团之间转移[soldiers|E]。"
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak 点击军团以选中它。#!"
 MAAM_S_IDLE_TILES_TT:0 "点击军团以选中它：其军团窗口会在左侧打开，下方按钮将作用于它。“再问一次”会检查你的军团并给出建议。"
 MAAM_S_IDLE_TITLE:0 "#weak 点击方格以在所属头衔内移动堆叠。#!"
 MAAM_S_IDLE_TITLE_TT:0 "点击堆叠方格将其提起，再在发绿光的同类型、同头衔军团上点击“放置”。军团行末的箭头按钮可转移[soldiers|E]。"
 MAAM_S_RES_RETRAINED:0 "@check_icon! [GetVariableSystem.Get( 'maam_rt_old_name' )]已重训为$MAAM_RT_NEW$，花费$MAAM_RT_P_RES$"
 MAAM_S_RES_FAILED:0 "#X 重训[GetVariableSystem.Get( 'maam_rt_old_name' )]失败。#!未产生任何花费。"

 # Strip, row 2
 MAAM_S_RT_L:0 "已预留1个栏位，完成前军团均被锁定。"
 MAAM_S_BLK_L:0 "转移堆叠、[soldiers|E]和重训需等你议和并解散所有军队。"
 MAAM_S_LIFT_L:0 "每次放置一个堆叠。"
 MAAM_S_ENDED_L:0 "合并会解散该军团，无法撤销。"
 MAAM_S_MERGE_L:0 "合并会解散该军团。能接收它的军团会显示“合并至此”。"
 MAAM_S_RES_DONE_L:0 "已继承规模和[soldiers|E]。新军团位于游戏排列新军团的位置。"
 MAAM_S_RES_FAILED_L:0 "该次点击中购买的一切均已移除并退款。"
 MAAM_PREF_LIST:0 "列表"
 MAAM_PREF_GROUPED:0 "分组"
 MAAM_PREF_TILES:0 "卡片"
 MAAM_PREF_SAVED:0 "随存档保存。"
 MAAM_BACK:0 "移回一个堆叠（[GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0]）"
 MAAM_BACK_TT:0 "将最近放置的堆叠移回其被提起的军团。再次点击可撤销本次提起中更早的放置（最多10次）。"
 MAAM_DONE:0 "完成"
 MAAM_CANCEL:0 "取消"
 MAAM_PUT_DOWN:0 "放下"
 MAAM_PUT_DOWN_TT:0 "结束提起。已放置的堆叠保持原位。"
 MAAM_ENDED_DONE_TT:0 "将最后一个堆叠保留为独立军团。"
 MAAM_KEEP_IT:0 "保留"
 MAAM_KEEP_IT_TT:0 "保留该军团，不进行合并。"
 MAAM_DESELECT_TT:0 "取消选择（关闭其军团窗口）"
 MAAM_DISMISS_TT:0 "关闭"
 MAAM_RT_CANCEL_TT:0 "结束重训。尚未购买或保留任何东西，因此没有任何花费。"

 # Moving soldiers
 MAAM_POUR_TT:0 "#T 转移士兵#!\n将此军团与另一个同类型军团配对。每次点击可向任一方向立即转移至多一个堆叠的[soldiers|E]；第一个堆叠始终保持满员。"
 MAAM_S_POUR_NONE:0 "目前没有其他同类型军团可以参与。"
 MAAM_S_POUR_NONE_L:0 "转移士兵需要另一个同类型军团。"
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "从[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]向[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]转移[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]名[soldiers|E]。\n#weak 每次点击至多一个堆叠；派出方的第一个堆叠保持满员。#!"
 MAAM_POUR_TAKE_TT:0 "从[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]向[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]转移[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]名[soldiers|E]。\n#weak 每次点击至多一个堆叠；派出方的第一个堆叠保持满员。#!"
 MAAM_POUR_NONE_TT:0 "#X 无法向此方向转移#!\n派出方需保持第一个堆叠满员，接收方也需要有空余。"
 MAAM_POUR_PREV_TT:0 "与上一个同类型军团配对"
 MAAM_POUR_NEXT_TT:0 "与下一个同类型军团配对"
 MAAM_POUR_BAR_TT:0 "#weak 蓝色：保留的第一个堆叠 · 金色：可转移的[soldiers|E] · 红色：空余#!"
 MAAM_POUR_DONE_TT:0 "结束转移士兵。所有转移均已立即生效。"

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T 规模[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E][Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak 旗帜为军旗，每个方格代表一个堆叠。金色：[soldiers|E] · 红色：缺少的[soldiers|E] · 空格：可再容纳一个堆叠。#!"
 MAAM_LANE_TITLE_TT:0 "所属头衔：[Regiment.GetOwningTitle.GetName]\n控制头衔：[Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I 点击名称以打开军团窗口#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak 重训进行中，已锁定。#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T 重训中#!\n此军团正在军械库中重训。"
 MAAM_BADGE_LOANED_TT:0 "#T 已借调#!\n已借调给[Regiment.GetControllingTitle.GetNameNoTooltip]。需待其归还后才能更改。"
 MAAM_BADGE_UNRAISED_TT:0 "#T 未集结#!\n你正处于战争中，而此军团尚未集结。"
 MAAM_BADGE_UNSTATIONED_TT:0 "#T 未驻扎#!\n此军团没有驻地，但你有可供驻扎的省份。"
 MAAM_TT_RETRAINING:0 "@alert_icon! #high 正在军械库中重训#!"
 MAAM_TT_LOANED:0 "@alert_icon! #high 已借调#!给[Regiment.GetControllingTitle.GetNameNoTooltip]"
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\n军旗：军团的第一个堆叠。它不会单独移动；“合并最后堆叠”会将整个军团并入另一个军团。"
 MAAM_PIECE_LIFT_TT:0 "提起一个堆叠，然后在发光的同类型军团上点击“放置”。"
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "放下该堆叠"
 MAAM_PIECE_PLACE_TT:0 "在此放置一个堆叠"
 MAAM_PLACE:0 "放置"
 MAAM_PLACE_TT:0 "将一个堆叠连同至多一个堆叠的[soldiers|E]移入此军团。立即生效。"
 MAAM_MERGE_HERE:0 "合并至此"
 MAAM_MERGE_HERE_TT:0 "#X 合并#!\n最后一个堆叠及其全部[soldiers|E]将并入此军团，另一个军团将被解散。\n\n#weak 此操作无法撤销。#!"
 MAAM_LOWER_TT:0 "#X 合并最后堆叠#!\n将此军团并入另一个同类型军团。能接收它的军团会显示“合并至此”。"
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E]：[Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]\n#weak 金色：士兵 · 红色：缺员。满条 = 当前规模下满员。#!"
 MAAM_BLOCKED_TT:0 "#X 暂不可用#!\n转移堆叠、[soldiers|E]和重训需等你议和并解散所有军队。"
 MAAM_RETRAIN_TT:0 "重训为另一种类型。将打开军械库：点击某个类型查看确切费用，然后点击“重训”。"
 MAAM_RETRAIN_BLOCKED_TT:0 "#X 目前无法重训此军团#!\n它必须属于你、受你控制且未集结。你必须处于和平状态、没有已集结的军队，且没有其他进行中的重训。"
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "请先关闭招募窗口。"
 MAAM_RETRAIN_TITLE_TT:0 "#X 不可用#!\n头衔军团暂时无法在军械库中重训。"
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X 不可用#!\n重训需要处于和平状态且没有已集结的军队。"
 MAAM_SEL_LIFT:0 "提起堆叠"
 MAAM_SEL_POUR:0 "转移士兵"
 MAAM_SEL_RETRAIN:0 "重训"
 MAAM_SEL_LOWER:0 "合并最后堆叠"
 MAAM_SEL_LIFT_TT:0 "#T 提起堆叠#!\n提起一个堆叠；然后点击发绿光的同类型军团，将其放置到那里。立即生效。"
 MAAM_SEL_LIFT_LONE_TT:0 "#X 只剩最后一个堆叠#!\n使用“合并最后堆叠”将其并入另一个同类型军团。"
 MAAM_SEL_BLOCKED_TT:0 "#X 此军团目前无法执行此操作#!"
 MAAM_SEL_NONE_TT:0 "请先选择一个军团：点击其卡片。"
 MAAM_LOWER_BIG_TT:0 "#X 合并最后堆叠#!\n仅在只剩一个堆叠时可用。请先将其余堆叠提起并放入同类型军团。"
 MAAM_PAIRED:0 "已配对"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "个军团"
 MAAM_GROUP_REGIMENT:0 "个军团"
 MAAM_GROUP_FOLD_TT:0 "折叠或展开此组"
 MAAM_GROUP_FROZEN_TT:0 "操作进行中时，分组保持不变。"

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "列表：游戏原有的顺序\n#weak 下次打开军事窗口时仍会沿用。#!"
 MAAM_VIEW_GROUPED_TT:0 "按类型分组，并显示每种类型的数量\n#weak 下次打开军事窗口时仍会沿用。#!"
 MAAM_VIEW_TILES_TT:0 "卡片，与原版游戏相同\n#weak 下次打开军事窗口时仍会沿用。#!"
 MAAM_VIEW_LOCKED_TT:0 "操作进行中时，视图保持不变。"
 MAAM_SETTINGS_TT:0 "尚未实现"

 # Quartermaster
 MAAM_QM_OPEN:0 "打开军团"
 MAAM_QM_OPEN_TT:0 "打开其军团窗口，可使用游戏自带的“增加规模”按钮。"
 MAAM_QM_SHOW:0 "指给我看"
 MAAM_QM_SHOW_TT:0 "高亮这两个军团。"
 MAAM_QM_NEXT:0 "下一条建议"
 MAAM_QM_ASK:0 "再问一次"
 MAAM_QM_ASK_TT:0 "重新检查你的军团。"
 MAAM_CREATE_BLOCKED_TT:0 "#X 重训期间不可用#!\n重训正占用一个临时军团栏位。请先完成或取消重训。"

 # Armory (recruitment window in retrain mode)
 MAAM_RT_PICKER_TITLE:0 "重训兵士"
 MAAM_RT_CUR_INFO:0 "堆叠[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] · [Regiment.GetMAAType.GetBaseTypeName]"
 MAAM_RT_CUR_STATIONED:0 "#X 驻扎于[Regiment.GetOriginProvince.GetName]：#!重训后需重新驻扎。"
 MAAM_RT_CUR_PRICE:0 " · $MAAM_RT_P_SRC$"
 MAAM_RT_CUR_PRICE_TT:0 "你为此类型每个堆叠支付的价格，于打开军械库时读取。每项重训费用均据此计算。"
 MAAM_RT_CUR_UNLISTED:0 " · #X 未读取价格#!"
 MAAM_RT_CUR_UNLISTED_TT:0 "#T 为何是新价格的一半#!\n军械库打开时（暂停中）会购买一个[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]堆叠并立即退款，以此读取你的价格。但这次无法做到：[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]目前不在你的招募列表中（其要求，如文化或革新，已不再满足），或者检查无法进行。因此费用改为新类型价格的一半。"
 MAAM_RT_CUR_REFUSED:0 " · #X 目前无法购买#!"
 MAAM_RT_CUR_REFUSED_TT:0 "#T 为何是新价格的一半#!\n价格是通过购买一个堆叠并在同一次点击中退款来读取的。游戏刚刚拒绝出售[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]，因此无法读取价格。费用改为新类型价格的一半。"
 MAAM_RT_CUR_NONGOLD:0 " · #X 未读取价格#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T 为何是新价格的一半#!\n价格是通过购买一个堆叠并在同一次点击中退款来读取的。购买[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]同时花费了金钱和国库，因此无法区分其价格。费用改为新类型每堆叠价格的一半（最低费用仍然适用）。"
 MAAM_RT_CUR_ROW:0 "[MenAtArmsType.GetNameNoTooltip] · 你的类型，正在读取价格"
 MAAM_RT_CUR_ROW_TT:0 "你的军团当前的类型。打开军械库时（暂停中）会读取一次其价格：购买一个堆叠并立即退款，随后此行消失。"
 MAAM_RT_CUR_UNKNOWN:0 " · #weak 正在读取价格…#!"
 MAAM_RT_CUR_UNKNOWN_TT:0 "打开军械库且游戏暂停时，会读取一次你为此类型支付的价格。若未显示，请暂停游戏。"
 MAAM_RT_ROLE_ALL:0 "全部"
 MAAM_RT_ROLE_ALL_TT:0 "显示所有可重训成的类型。"
 MAAM_RT_ROLE_TT:0 "仅显示[MenAtArmsType.GetBaseTypeName]"
