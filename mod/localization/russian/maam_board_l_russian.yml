l_russian:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high Интендант#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high Настройки панели#! · Вид по умолчанию при открытии окна «Армия»."
 MAAM_S_RT:0 "Переобучение: $MAAM_RT_SRC$. Выберите новый тип слева."
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$Идет война."
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$Армия собрана."
 MAAM_S_LIFT:0 "Взят стек: $MAAM_OB_SRC$. Нажмите «Поставить» у полка с зеленой подсветкой."
 MAAM_S_ENDED:0 "$MAAM_OB_SRC$: остался последний стек."
 MAAM_S_ENDED_TT:0 "$MAAM_OB_SRC$: остался последний стек. Полки, которые могут его принять, показывают красную кнопку «Влить сюда»; «Готово» оставляет его отдельным полком."
 MAAM_S_MERGE:0 "Слияние последнего стека: $MAAM_OB_SRC$."
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · стеков: [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] · [soldiers|E]: [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount]#!"
 MAAM_S_SEL_TT:0 "Выбран полк $MAAM_OB_SEL$, его окно открыто слева. Действия — ниже; чтобы снять выбор, снова нажмите на плитку или на ×."
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$: можно добавить еще [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]."
 MAAM_S_GROW_TT:0 "Размер полка $MAAM_QM_A$ можно увеличить еще на [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]. Доступно ли это сейчас, покажет окно полка."
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$Два полка $MAAM_QM_A$ уместятся в одном."
 MAAM_S_COMBINE_TT:0 "Все слоты полков заняты, а два полка $MAAM_QM_A$ уместятся в одном. Объединение освободит слот; пока вы не займете его новым полком, ваша армия будет меньше. «Показать» подсветит оба."
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak Нажмите на фишку, чтобы взять стек.#!"
 MAAM_S_IDLE_TT:0 "Нажмите на фишку стека, чтобы взять его, затем нажмите «Поставить» у подсвеченного зеленым полка того же типа. Кнопкой со стрелками в конце строки полка между полками одного типа перемещаются [soldiers|E]."
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak Нажмите на полк, чтобы выбрать его.#!"
 MAAM_S_IDLE_TILES_TT:0 "Нажмите на полк, чтобы выбрать его: слева откроется окно полка, а кнопки ниже будут действовать на него. «Спросить» снова осмотрит ваши полки и даст советы."
 MAAM_S_IDLE_TITLE:0 "#weak Нажмите на фишку, чтобы перенести стек внутри титула.#!"
 MAAM_S_IDLE_TITLE_TT:0 "Нажмите на фишку стека, чтобы взять его, затем нажмите «Поставить» у подсвеченного зеленым полка того же типа и титула. Кнопкой со стрелками в конце строки полка перемещаются [soldiers|E]."
 MAAM_S_RES_RETRAINED:0 "@check_icon! Переобучение: [GetVariableSystem.Get( 'maam_rt_old_name' )] → $MAAM_RT_NEW$ за $MAAM_RT_P_RES$"
 MAAM_S_RES_FAILED:0 "#X Переобучение не удалось: [GetVariableSystem.Get( 'maam_rt_old_name' )].#! Ничего не потрачено."

 # Strip, row 2
 MAAM_S_RT_L:0 "До завершения: 1 слот занят, полки заблокированы."
 MAAM_S_BLK_L:0 "Стеки, [soldiers|E] и переобучение — только в мире и при распущенных армиях."
 MAAM_S_LIFT_L:0 "По одному стеку за раз."
 MAAM_S_ENDED_L:0 "Слияние распускает полк. Необратимо."
 MAAM_S_MERGE_L:0 "Слияние распустит полк. Принять его могут полки с «Влить сюда»."
 MAAM_S_RES_DONE_L:0 "Размер и [soldiers|E] перенесены. Новый полк стоит там, где игра показывает новые полки."
 MAAM_S_RES_FAILED_L:0 "Всё купленное этим нажатием удалено, средства возвращены."
 MAAM_PREF_LIST:0 "Список"
 MAAM_PREF_GROUPED:0 "Группы"
 MAAM_PREF_TILES:0 "Плитки"
 MAAM_PREF_SAVED:0 "Сохраняется с игрой."
 MAAM_BACK:0 "Вернуть стек ([GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0])"
 MAAM_BACK_TT:0 "Возвращает последний поставленный стек в полк, из которого он был взят. Нажмите снова, чтобы вернуть и стеки, поставленные раньше (до 10)."
 MAAM_DONE:0 "Готово"
 MAAM_CANCEL:0 "Отмена"
 MAAM_PUT_DOWN:0 "Отпустить"
 MAAM_PUT_DOWN_TT:0 "Завершает перемещение. Уже поставленные стеки остаются на месте."
 MAAM_ENDED_DONE_TT:0 "Оставляет последний стек отдельным полком."
 MAAM_KEEP_IT:0 "Оставить"
 MAAM_KEEP_IT_TT:0 "Полк остается. Слияния не будет."
 MAAM_DESELECT_TT:0 "Снять выбор (закрывает окно полка)"
 MAAM_DISMISS_TT:0 "Закрыть"
 MAAM_RT_CANCEL_TT:0 "Прерывает переобучение. Ничего не куплено и не зарезервировано, поэтому ничего не потрачено."

 # Moving soldiers
 MAAM_POUR_TT:0 "#T Обмен солдат#!\nСтавит этот полк в пару с другим полком того же типа. Каждым нажатием в ту или другую сторону сразу перемещаются [soldiers|E] — не больше одного стека; первый стек всегда остается полным."
 MAAM_S_POUR_NONE:0 "Сейчас нет другого полка этого типа для обмена."
 MAAM_S_POUR_NONE_L:0 "Для обмена солдат нужен второй полк того же типа."
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "Отправить из полка [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] в полк [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]. [soldiers|E]: [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )].\n#weak Не больше одного стека за нажатие; первый стек отправителя остается полным.#!"
 MAAM_POUR_TAKE_TT:0 "Отправить из полка [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] в полк [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]. [soldiers|E]: [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )].\n#weak Не больше одного стека за нажатие; первый стек отправителя остается полным.#!"
 MAAM_POUR_NONE_TT:0 "#X В эту сторону перемещать нечего#!\nПервый стек отправителя остается полным, а получателю нужно свободное место."
 MAAM_POUR_PREV_TT:0 "В пару с предыдущим полком этого типа"
 MAAM_POUR_NEXT_TT:0 "В пару со следующим полком этого типа"
 MAAM_POUR_BAR_TT:0 "#weak Синий: первый стек, он остается · золотой: [soldiers|E], которые могут перейти · красный: свободное место#!"
 MAAM_POUR_DONE_TT:0 "Завершает обмен солдат. Все перемещения уже выполнены."

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T Размер [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E]: [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak Флаг — знамя, каждый квадрат — один стек. Золотой: [soldiers|E] · красный: недостающие [soldiers|E] · пустой: место для еще одного стека.#!"
 MAAM_LANE_TITLE_TT:0 "Титул-обладатель: [Regiment.GetOwningTitle.GetName]\nКонтролирующий титул: [Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I Нажмите на название, чтобы открыть окно полка#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak Заблокировано на время переобучения.#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T Переобучение#!\nЭтот полк переобучается в арсенале."
 MAAM_BADGE_LOANED_TT:0 "#T Передан#!\nПередан титулу «[Regiment.GetControllingTitle.GetNameNoTooltip]». Изменения — после его возвращения."
 MAAM_BADGE_UNRAISED_TT:0 "#T Не собран#!\nИдет война, а этот полк не собран."
 MAAM_BADGE_UNSTATIONED_TT:0 "#T Не размещен#!\nУ этого полка нет места расположения, хотя у вас есть провинции, где его можно разместить."
 MAAM_TT_RETRAINING:0 "@alert_icon! #high Переобучается#! в арсенале"
 MAAM_TT_LOANED:0 "@alert_icon! #high Передан#! титулу «[Regiment.GetControllingTitle.GetNameNoTooltip]»"
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\nЗнамя — первый стек полка. Само по себе оно не перемещается; «Влить последний» вливает весь полк в другой."
 MAAM_PIECE_LIFT_TT:0 "Возьмите стек и нажмите «Поставить» у подсвеченного полка того же типа."
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "Отпустить стек"
 MAAM_PIECE_PLACE_TT:0 "Поставить сюда один стек"
 MAAM_PLACE:0 "Поставить"
 MAAM_PLACE_TT:0 "Перемещает в этот полк один стек; с ним переходят [soldiers|E], не больше чем на один стек. Выполняется сразу."
 MAAM_MERGE_HERE:0 "Влить сюда"
 MAAM_MERGE_HERE_TT:0 "#X Слияние#!\nПоследний стек и все его [soldiers|E] переходят в этот полк, а другой полк распускается.\n\n#weak Отменить это нельзя.#!"
 MAAM_LOWER_TT:0 "#X Влить последний стек#!\nВливает этот полк в другой полк того же типа. Полки, готовые его принять, показывают «Влить сюда»."
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E]: [Regiment.CalcMenAliveCount] из [Regiment.GetMaxCount]\n#weak Золотой: солдаты · красный: недостающие. Полная полоса — полная сила при этом размере.#!"
 MAAM_BLOCKED_TT:0 "#X Не сейчас#!\nСтеки, [soldiers|E] и переобучение — только в мире и при распущенных армиях."
 MAAM_RETRAIN_TT:0 "Переобучить в другой тип. Открывает арсенал: выберите тип, чтобы увидеть точную плату, затем нажмите «Переобучить»."
 MAAM_RETRAIN_BLOCKED_TT:0 "#X Этот полк сейчас нельзя переобучить#!\nПолк должен быть вашим, под вашим контролем и несобранным. Нужен мир, ни одной собранной армии и ни одного другого открытого переобучения."
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "Сначала закройте окно найма."
 MAAM_RETRAIN_TITLE_TT:0 "#X Недоступно#!\nТитулярные полки пока нельзя переобучать в арсенале."
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X Недоступно#!\nДля переобучения нужен мир и ни одной собранной армии."
 MAAM_SEL_LIFT:0 "Взять стек"
 MAAM_SEL_POUR:0 "Обмен солдат"
 MAAM_SEL_RETRAIN:0 "Переучить"
 MAAM_SEL_LOWER:0 "Влить последний"
 MAAM_SEL_LIFT_TT:0 "#T Взять стек#!\nБерет один стек; затем нажмите на подсвеченный зеленым полк того же типа, чтобы поставить его туда. Выполняется сразу."
 MAAM_SEL_LIFT_LONE_TT:0 "#X Остался последний стек#!\nНажмите «Влить последний», чтобы влить его в другой полк того же типа."
 MAAM_SEL_BLOCKED_TT:0 "#X Сейчас недоступно для этого полка#!"
 MAAM_SEL_NONE_TT:0 "Сначала выберите полк: нажмите на его плитку."
 MAAM_LOWER_BIG_TT:0 "#X Влить последний стек#!\nТолько когда остался один стек. Сначала перенесите остальные его стеки в полки того же типа."
 MAAM_PAIRED:0 "В паре"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "полк."
 MAAM_GROUP_REGIMENT:0 "полк"
 MAAM_GROUP_FOLD_TT:0 "Свернуть или развернуть группу"
 MAAM_GROUP_FROZEN_TT:0 "Пока действие не завершено, группы не меняются."

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "Список: порядок как в игре\n#weak Запоминается до следующего открытия окна «Армия».#!"
 MAAM_VIEW_GROUPED_TT:0 "По типам, с числом полков каждого типа\n#weak Запоминается до следующего открытия окна «Армия».#!"
 MAAM_VIEW_TILES_TT:0 "Плитки, как в оригинальной игре\n#weak Запоминается до следующего открытия окна «Армия».#!"
 MAAM_VIEW_LOCKED_TT:0 "Пока действие не завершено, вид не меняется."
 MAAM_SETTINGS_TT:0 "Пока не реализовано"

 # Quartermaster
 MAAM_QM_OPEN:0 "Открыть полк"
 MAAM_QM_OPEN_TT:0 "Открывает окно полка с игровой кнопкой «Увеличить размер»."
 MAAM_QM_SHOW:0 "Показать"
 MAAM_QM_SHOW_TT:0 "Подсвечивает оба полка."
 MAAM_QM_NEXT:0 "Далее"
 MAAM_QM_ASK:0 "Спросить"
 MAAM_QM_ASK_TT:0 "Заново осматривает ваши полки."
 MAAM_CREATE_BLOCKED_TT:0 "#X Не во время переобучения#!\nПереобучение занимает временный слот полка. Сначала завершите или отмените его."

 # Armory (recruitment window in retrain mode)
 MAAM_RT_PICKER_TITLE:0 "Переобучение полка"
 MAAM_RT_CUR_INFO:0 "Стеков: [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] · [Regiment.GetMAAType.GetBaseTypeName]"
 MAAM_RT_CUR_STATIONED:0 "#X Расположение: [Regiment.GetOriginProvince.GetName]#! — после переобучения разместите снова."
 MAAM_RT_CUR_PRICE:0 " · $MAAM_RT_P_SRC$"
 MAAM_RT_CUR_PRICE_TT:0 "Ваша цена за стек этого типа, узнанная при открытии арсенала. Из нее рассчитывается каждая плата за переобучение."
 MAAM_RT_CUR_UNLISTED:0 " · #X цена неизвестна#!"
 MAAM_RT_CUR_UNLISTED_TT:0 "#T Почему половина новой цены#!\nПри открытии (на паузе) арсенал узнает вашу цену: покупает один стек типа «[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]» и сразу возмещает его стоимость. Это не удалось: типа «[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]» сейчас нет в вашем списке найма (его требования, например культура или инновация, больше не выполнены), или проверку не удалось провести. Поэтому плата — половина цены нового типа."
 MAAM_RT_CUR_REFUSED:0 " · #X сейчас не продается#!"
 MAAM_RT_CUR_REFUSED_TT:0 "#T Почему половина новой цены#!\nЦены узнаются покупкой одного стека с возмещением в том же нажатии. Игра только что отказалась продать тип «[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]», поэтому цену узнать нельзя. Плата — половина цены нового типа."
 MAAM_RT_CUR_NONGOLD:0 " · #X цена неизвестна#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T Почему половина новой цены#!\nЦены узнаются покупкой одного стека с возмещением в том же нажатии. Покупка типа «[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]» списала и золото, и средства казны, поэтому цену не разделить. Плата — половина цены нового типа за стек (минимум по-прежнему действует)."
 MAAM_RT_CUR_ROW:0 "[MenAtArmsType.GetNameNoTooltip] · ваш тип, цена уточняется"
 MAAM_RT_CUR_ROW_TT:0 "Текущий тип вашего полка. Его цена узнается один раз при открытии арсенала (на паузе): один стек покупается и сразу возмещается, затем эта строка исчезает."
 MAAM_RT_CUR_UNKNOWN:0 " · #weak цена уточняется…#!"
 MAAM_RT_CUR_UNKNOWN_TT:0 "Ваша цена за этот тип узнается один раз при открытии арсенала, пока игра на паузе. Если цена не появилась, поставьте игру на паузу."
 MAAM_RT_ROLE_ALL:0 "Все"
