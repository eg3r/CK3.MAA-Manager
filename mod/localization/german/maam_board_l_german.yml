l_german:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high Quartiermeister#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high Einstellungen#! · Startansicht beim Öffnen des Militärfensters."
 MAAM_S_RT:0 "$MAAM_RT_SRC$ wird umgeschult. Wählt links den neuen Typ."
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$Im Krieg."
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$Eine Armee ist ausgehoben."
 MAAM_S_LIFT:0 "Stapel aus $MAAM_OB_SRC$ gehoben. Klickt „Einfügen“ bei einem grünen Regiment."
 MAAM_S_ENDED:0 "Von $MAAM_OB_SRC$ ist nur der letzte Stapel übrig."
 MAAM_S_ENDED_TT:0 "Von $MAAM_OB_SRC$ ist nur der letzte Stapel übrig. Regimenter, die ihn aufnehmen können, zeigen das rote „Vereinen“; „Fertig“ behält ihn als eigenes Regiment."
 MAAM_S_MERGE:0 "Letzter Stapel von $MAAM_OB_SRC$ wird vereint."
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] Stapel · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount] [soldiers|E]#!"
 MAAM_S_SEL_TT:0 "$MAAM_OB_SEL$ ist ausgewählt, sein Regimentsfenster ist links geöffnet. Seine Aktionen stehen unten; klickt erneut auf die Kachel oder auf ×, um die Auswahl aufzuheben."
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$ hat Platz für [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )] weitere."
 MAAM_S_GROW_TT:0 "$MAAM_QM_A$ kann um [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )] Stapel wachsen. Sein Regimentsfenster zeigt, ob Ihr es jetzt vergrößern könnt."
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$Zwei $MAAM_QM_A$-Regimenter passen in eines."
 MAAM_S_COMBINE_TT:0 "Alle Plätze sind belegt, und zwei $MAAM_QM_A$-Regimenter passen in eines. Vereinen macht einen Platz frei; bis Ihr ihn mit einem neuen Regiment füllt, ist Eure Armee kleiner. „Zeigen“ hebt beide hervor."
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak Klickt auf ein Feld, um einen Stapel zu heben.#!"
 MAAM_S_IDLE_TT:0 "Klickt auf ein Stapelfeld, um den Stapel zu heben, dann bei einem grün leuchtenden Regiment desselben Typs auf „Einfügen“. Die Pfeil-Schaltfläche am Ende einer Regimentszeile verschiebt [soldiers|E] zwischen Regimentern desselben Typs."
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak Klickt auf ein Regiment, um es auszuwählen.#!"
 MAAM_S_IDLE_TILES_TT:0 "Klickt auf ein Regiment, um es auszuwählen: Sein Regimentsfenster öffnet sich links, und die Schaltflächen unten wirken darauf. „Neu prüfen“ sucht in Euren Regimentern nach Tipps."
 MAAM_S_IDLE_TITLE:0 "#weak Klickt auf ein Feld, um einen Stapel im Titel zu verschieben.#!"
 MAAM_S_IDLE_TITLE_TT:0 "Klickt auf ein Stapelfeld, um den Stapel zu heben, dann bei einem grün leuchtenden Regiment desselben Typs und Titels auf „Einfügen“. Die Pfeil-Schaltfläche am Ende einer Regimentszeile verschiebt [soldiers|E]."
 MAAM_S_RES_RETRAINED:0 "@check_icon! [GetVariableSystem.Get( 'maam_rt_old_name' )] für $MAAM_RT_P_RES$zu $MAAM_RT_NEW$ umgeschult"
 MAAM_S_RES_FAILED:0 "#X Umschulung von [GetVariableSystem.Get( 'maam_rt_old_name' )] gescheitert.#! Nichts ausgegeben."

 # Strip, row 2
 MAAM_S_RT_L:0 "1 Platz reserviert, Regimenter gesperrt bis zum Abschluss."
 MAAM_S_BLK_L:0 "Stapel, [soldiers|E] und Umschulung warten auf Frieden und aufgelöste Armeen."
 MAAM_S_LIFT_L:0 "Ein Stapel pro Klick."
 MAAM_S_ENDED_L:0 "Vereinen löst das Regiment auf. Endgültig."
 MAAM_S_MERGE_L:0 "Vereinen löst es auf. Passende Regimenter zeigen „Vereinen“."
 MAAM_S_RES_DONE_L:0 "Größe und [soldiers|E] übernommen. Das neue Regiment steht, wo das Spiel neue einreiht."
 MAAM_S_RES_FAILED_L:0 "Alles in diesem Klick Gekaufte wurde entfernt und erstattet."
 MAAM_PREF_LIST:0 "Liste"
 MAAM_PREF_GROUPED:0 "Gruppen"
 MAAM_PREF_TILES:0 "Kacheln"
 MAAM_PREF_SAVED:0 "Gilt pro Spielstand."
 MAAM_BACK:0 "Stapel zurück ([GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0])"
 MAAM_BACK_TT:0 "Setzt den zuletzt eingefügten Stapel zurück in das Regiment, aus dem Ihr ihn gehoben habt. Erneutes Klicken macht frühere Einfügungen dieses Vorgangs rückgängig (bis zu 10)."
 MAAM_DONE:0 "Fertig"
 MAAM_CANCEL:0 "Abbrechen"
 MAAM_PUT_DOWN:0 "Ablegen"
 MAAM_PUT_DOWN_TT:0 "Legt den Stapel ab. Bereits eingefügte Stapel bleiben, wo sie sind."
 MAAM_ENDED_DONE_TT:0 "Behält den letzten Stapel als eigenes Regiment."
 MAAM_KEEP_IT:0 "Behalten"
 MAAM_KEEP_IT_TT:0 "Behält das Regiment. Nichts wird vereint."
 MAAM_DESELECT_TT:0 "Auswahl aufheben (schließt das Regimentsfenster)"
 MAAM_DISMISS_TT:0 "Ausblenden"
 MAAM_RT_CANCEL_TT:0 "Beendet die Umschulung. Nichts wurde gekauft oder gehalten, also wird nichts ausgegeben."

 # Moving soldiers
 MAAM_POUR_TT:0 "#T Truppen umverteilen#!\nKoppelt dieses Regiment mit einem anderen desselben Typs. Jeder Klick verschiebt sofort höchstens einen Stapel [soldiers|E] in die eine oder andere Richtung; der erste Stapel bleibt immer voll."
 MAAM_S_POUR_NONE:0 "Kein anderes Regiment dieses Typs kann gerade teilnehmen."
 MAAM_S_POUR_NONE_L:0 "Umverteilen braucht ein zweites Regiment desselben Typs."
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] von [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] zu [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] schicken.\n#weak Höchstens ein Stapel pro Klick; der Absender behält seinen ersten Stapel voll.#!"
 MAAM_POUR_TAKE_TT:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] von [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] zu [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] schicken.\n#weak Höchstens ein Stapel pro Klick; der Absender behält seinen ersten Stapel voll.#!"
 MAAM_POUR_NONE_TT:0 "#X In diese Richtung geht nichts#!\nDer Absender behält seinen ersten Stapel voll, und der Empfänger braucht Platz."
 MAAM_POUR_PREV_TT:0 "Mit dem vorigen Regiment dieses Typs koppeln"
 MAAM_POUR_NEXT_TT:0 "Mit dem nächsten Regiment dieses Typs koppeln"
 MAAM_POUR_BAR_TT:0 "#weak Blau: der erste Stapel, der bleibt · Gold: verschiebbare [soldiers|E] · Rot: freier Platz#!"
 MAAM_POUR_DONE_TT:0 "Beendet das Umverteilen. Alle Verschiebungen sind bereits erfolgt."

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T Größe [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E] [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak Die Flagge ist die Standarte, jedes Feld ein Stapel. Gold: [soldiers|E] · Rot: fehlende [soldiers|E] · Leer: Platz für einen weiteren Stapel.#!"
 MAAM_LANE_TITLE_TT:0 "Besitzender Titel: [Regiment.GetOwningTitle.GetName]\nKontrollierender Titel: [Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I Auf den Namen klicken, um das Regimentsfenster zu öffnen#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak Gesperrt, solange eine Umschulung läuft.#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T Umschulung#!\nDieses Regiment wird in der Waffenkammer umgeschult."
 MAAM_BADGE_LOANED_TT:0 "#T Verliehen#!\nAn [Regiment.GetControllingTitle.GetNameNoTooltip] verliehen. Änderungen warten, bis es zurückkehrt."
 MAAM_BADGE_UNRAISED_TT:0 "#T Nicht ausgehoben#!\nIhr seid im Krieg, und dieses Regiment ist nicht ausgehoben."
 MAAM_BADGE_UNSTATIONED_TT:0 "#T Nicht stationiert#!\nDieses Regiment ist nicht stationiert, obwohl Ihr Provinzen habt, die es aufnehmen könnten."
 MAAM_TT_RETRAINING:0 "@alert_icon! #high In Umschulung#! in der Waffenkammer"
 MAAM_TT_LOANED:0 "@alert_icon! #high Verliehen#! an [Regiment.GetControllingTitle.GetNameNoTooltip]"
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\nDie Standarte: der erste Stapel des Regiments. Sie bewegt sich nie allein; „Rest vereinen“ vereint das ganze Regiment mit einem anderen."
 MAAM_PIECE_LIFT_TT:0 "Stapel heben, dann bei einem leuchtenden Regiment desselben Typs auf „Einfügen“ klicken."
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "Stapel ablegen"
 MAAM_PIECE_PLACE_TT:0 "Einen Stapel hier einfügen"
 MAAM_PLACE:0 "Einfügen"
 MAAM_PLACE_TT:0 "Verschiebt einen Stapel mit bis zu einem Stapel [soldiers|E] in dieses Regiment. Geschieht sofort."
 MAAM_MERGE_HERE:0 "Vereinen"
 MAAM_MERGE_HERE_TT:0 "#X Vereinen#!\nDer letzte Stapel und alle seine [soldiers|E] gehen in dieses Regiment über, das andere Regiment wird aufgelöst.\n\n#weak Dies kann nicht rückgängig gemacht werden.#!"
 MAAM_LOWER_TT:0 "#X Rest vereinen#!\nVereint dieses Regiment mit einem anderen desselben Typs. Regimenter, die es aufnehmen können, zeigen „Vereinen“."
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E]: [Regiment.CalcMenAliveCount] von [Regiment.GetMaxCount]\n#weak Gold: Truppen · Rot: fehlend. Voller Balken = volle Stärke bei dieser Größe.#!"
 MAAM_BLOCKED_TT:0 "#X Nicht jetzt#!\nStapel, [soldiers|E] und Umschulung warten auf Frieden und aufgelöste Armeen."
 MAAM_RETRAIN_TT:0 "In einen anderen Typ umschulen. Öffnet die Waffenkammer: Klickt auf einen Typ, um seine genaue Gebühr zu sehen, dann auf „Umschulen“."
 MAAM_RETRAIN_BLOCKED_TT:0 "#X Dieses Regiment kann jetzt nicht umgeschult werden#!\nEs muss Euch gehören, unter Eurer Kontrolle stehen und nicht ausgehoben sein. Ihr müsst im Frieden sein, ohne ausgehobene Armeen, und keine andere Umschulung darf offen sein."
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "Schließt zuerst das Anwerbungsfenster."
 MAAM_RETRAIN_TITLE_TT:0 "#X Nicht verfügbar#!\nTitelregimenter können noch nicht in der Waffenkammer umgeschult werden."
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X Nicht verfügbar#!\nUmschulen erfordert Frieden und keine ausgehobenen Armeen."
 MAAM_SEL_LIFT:0 "Stapel heben"
 MAAM_SEL_POUR:0 "Umverteilen"
 MAAM_SEL_RETRAIN:0 "Umschulen"
 MAAM_SEL_LOWER:0 "Rest vereinen"
 MAAM_SEL_LIFT_TT:0 "#T Stapel heben#!\nHebt einen Stapel; klickt dann auf ein grün leuchtendes Regiment desselben Typs, um ihn dort einzufügen. Geschieht sofort."
 MAAM_SEL_LIFT_LONE_TT:0 "#X Nur der letzte Stapel ist übrig#!\nNutzt „Rest vereinen“, um ihn mit einem anderen Regiment desselben Typs zu vereinen."
 MAAM_SEL_BLOCKED_TT:0 "#X Für dieses Regiment gerade nicht verfügbar#!"
 MAAM_SEL_NONE_TT:0 "Wählt zuerst ein Regiment: Klickt auf seine Kachel."
 MAAM_LOWER_BIG_TT:0 "#X Rest vereinen#!\nNur wenn ein Stapel übrig ist. Verschiebt zuerst seine anderen Stapel in Regimenter desselben Typs."
 MAAM_PAIRED:0 "Partner"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "Regimenter"
 MAAM_GROUP_REGIMENT:0 "Regiment"
 MAAM_GROUP_FOLD_TT:0 "Gruppe ein- oder ausklappen"
 MAAM_GROUP_FROZEN_TT:0 "Gruppen bleiben unverändert, solange eine Aktion offen ist."

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "Liste: die Reihenfolge des Spiels\n#weak Wird für das nächste Öffnen des Militärfensters gemerkt.#!"
 MAAM_VIEW_GROUPED_TT:0 "Gruppen: nach Typ, mit Anzahl pro Typ\n#weak Wird für das nächste Öffnen des Militärfensters gemerkt.#!"
 MAAM_VIEW_TILES_TT:0 "Kacheln wie im Grundspiel\n#weak Wird für das nächste Öffnen des Militärfensters gemerkt.#!"
 MAAM_VIEW_LOCKED_TT:0 "Die Ansicht bleibt, solange eine Aktion offen ist."
 MAAM_SETTINGS_TT:0 "Noch nicht implementiert"

 # Quartermaster
 MAAM_QM_OPEN:0 "Regiment öffnen"
 MAAM_QM_OPEN_TT:0 "Öffnet sein Regimentsfenster mit der spieleigenen Schaltfläche „Größe erhöhen“."
 MAAM_QM_SHOW:0 "Zeigen"
 MAAM_QM_SHOW_TT:0 "Hebt beide Regimenter hervor."
 MAAM_QM_NEXT:0 "Weiter"
 MAAM_QM_ASK:0 "Neu prüfen"
 MAAM_QM_ASK_TT:0 "Prüft Eure Regimenter erneut."
 MAAM_CREATE_BLOCKED_TT:0 "#X Nicht während einer Umschulung#!\nEine Umschulung belegt einen vorübergehenden Regimentsplatz. Schließt sie zuerst ab oder brecht sie ab."

 # Armory (recruitment window in retrain mode)
 MAAM_RT_PICKER_TITLE:0 "Kriegsvolk umschulen"
 MAAM_RT_CUR_INFO:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] Stapel · [Regiment.GetMAAType.GetBaseTypeName]"
 MAAM_RT_CUR_STATIONED:0 "#X Stationiert in [Regiment.GetOriginProvince.GetName]:#! danach neu stationieren."
 MAAM_RT_CUR_PRICE:0 " · $MAAM_RT_P_SRC$"
 MAAM_RT_CUR_PRICE_TT:0 "Euer Preis pro Stapel dieses Typs, ermittelt beim Öffnen der Waffenkammer. Jede Umschulungsgebühr wird daraus berechnet."
 MAAM_RT_CUR_UNLISTED:0 " · #X Preis unbekannt#!"
 MAAM_RT_CUR_UNLISTED_TT:0 "#T Warum der halbe neue Preis#!\nDie Waffenkammer ermittelt Euren Preis, indem sie beim Öffnen (pausiert) einen Stapel [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] kauft und erstattet. Das war nicht möglich: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] steht derzeit nicht in Eurer Anwerbungsliste (seine Voraussetzungen, etwa eine Kultur oder Innovation, sind nicht mehr erfüllt), oder die Prüfung konnte nicht laufen. Stattdessen beträgt die Gebühr den halben Preis des neuen Typs."
 MAAM_RT_CUR_REFUSED:0 " · #X nicht käuflich#!"
 MAAM_RT_CUR_REFUSED_TT:0 "#T Warum der halbe neue Preis#!\nPreise werden ermittelt, indem im selben Klick ein Stapel gekauft und erstattet wird. Das Spiel hat den Kauf von [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] eben verweigert, also gibt es keinen Preis. Stattdessen beträgt die Gebühr den halben Preis des neuen Typs."
 MAAM_RT_CUR_NONGOLD:0 " · #X Preis unbekannt#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T Warum der halbe neue Preis#!\nPreise werden ermittelt, indem im selben Klick ein Stapel gekauft und erstattet wird. Der Kauf von [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] kostete sowohl Gold als auch Schatz, daher lässt sich sein Preis nicht trennen. Die Gebühr beträgt stattdessen den halben Preis des neuen Typs pro Stapel (das Minimum gilt weiterhin)."
 MAAM_RT_CUR_ROW:0 "[MenAtArmsType.GetNameNoTooltip] · Euer Typ, Preisabfrage"
 MAAM_RT_CUR_ROW_TT:0 "Der aktuelle Typ Eures Regiments. Sein Preis wird einmal beim Öffnen der Waffenkammer ermittelt (pausiert): Ein Stapel wird gekauft und sofort erstattet, dann verschwindet diese Zeile."
 MAAM_RT_CUR_UNKNOWN:0 " · #weak Preisabfrage …#!"
 MAAM_RT_CUR_UNKNOWN_TT:0 "Euer Preis für diesen Typ wird einmal beim Öffnen der Waffenkammer ermittelt, während das Spiel pausiert ist. Pausiert das Spiel, falls er nicht erscheint."
 MAAM_RT_ROLE_ALL:0 "Alle"
 MAAM_RT_ROLE_ALL_TT:0 "Alle Typen zeigen, in die Ihr umschulen könntet."
 MAAM_RT_ROLE_TT:0 "Nur [MenAtArmsType.GetBaseTypeName] zeigen"
 MAAM_RT_ROLE_ON_TT:0 "Wieder alle Typen zeigen"
 MAAM_RT_STACK_LINE:0 "[soldiers|E] pro Stapel [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStackSize] → [MenAtArmsType.GetStackSize]: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] von [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] werden [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] von [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]"
 MAAM_RT_STACK_LINE_TT:0 "#T Andere Anzahl [soldiers|E] pro Stapel#!\nDas neue Regiment behält Größe und Füllstand: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] von [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] [soldiers|E] werden [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] von [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]. Fehlende [soldiers|E] werden wie üblich aufgefüllt."
 MAAM_RT_PAUSE_FIRST:0 "#X Pausiert das Spiel zum Umschulen.#! Preise werden nur in der Pause geprüft."
 MAAM_RT_HINT:0 "Wählt in der Liste einen neuen Typ."
 MAAM_RT_TGT_REFUSED:0 "#high [GetVariableSystem.Get( 'maam_rt_name' )]#! konnte nicht gekauft werden. Nichts wurde ausgegeben."
 MAAM_RT_HEADER:0 "[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] → [GetVariableSystem.Get( 'maam_rt_name' )]"
 MAAM_RT_UPKEEP_LINE:0 "Unterhalt pro Stapel: [MenAtArmsType.GetFullStrengthMaintenanceCostForPlayerString]"
