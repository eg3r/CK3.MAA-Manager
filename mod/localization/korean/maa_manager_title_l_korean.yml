l_korean:
 MAA_MANAGER_TITLE_WINDOW_TITLE:0 "작위 무장병 관리"
 MAA_MANAGER_TITLE_BUTTON_TOOLTIP:0 "작위 무장병 관리"
 MAA_MANAGER_TITLE_MODE_HINT:0 "같은 소유 작위의 부대끼리만 이동할 수 있습니다. 대여한 부대는 조회만 가능합니다."
 MAA_MANAGER_TITLE_REGIMENT_TOOLTIP:0 "소유 작위: [Regiment.GetOwningTitle.GetName]\n통제 작위: [Regiment.GetControllingTitle.GetName]"
 MAA_MANAGER_TITLE_RETRAIN_STATIONED:0 "#X 주둔 중인 연대는 재훈련할 수 없습니다.#!\n먼저 기본 연대 창에서 주둔을 해제하십시오."
 MAA_MANAGER_TITLE_RETRAIN_UNAVAILABLE:0 "#X 작위 부대를 재훈련할 수 없습니다.#!\n작위에 해당 병종을 모집할 자격, 빈 연대 자리 및 게임에서 요구하는 자금이 필요합니다. 연대는 본인이 통제하며 주둔 중이 아니어야 합니다."
 MAA_MANAGER_TITLE_RETRAIN_FAILED:0 "#X 재훈련을 완료하지 못했습니다.#! 기존 연대를 유지했으며 예상치 못한 차감액을 환불했습니다."
 MAA_MANAGER_TITLE_COST_TREASURY_TOOLTIP:0 "기본 비용은 금화 환산액입니다. 기존 재훈련 비용을 국고로 환산합니다.\n단위당: [GetPlayer.MakeScope.ScriptValue('maa_manager_retrain_per_stack_cost')|0] [treasury|E]\n합계: [GetPlayer.MakeScope.ScriptValue('maa_manager_retrain_gold_cost')|0] [treasury|E]"
 MAA_MANAGER_TITLE_EMPTY:0 "보유 작위에 소속된 무장병이 없습니다."
 MAA_MANAGER_TITLE_RETRAIN_REQUIREMENTS:0 "작위에 해당 병종을 모집할 자격, 빈 연대 자리 및 게임에서 요구하는 자금이 필요합니다. 연대는 본인이 통제하며 주둔 중이 아니어야 합니다."
