l_korean:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high 병참장#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high 보드 설정#! · 군사 창을 열 때의 기본 보기입니다."
 MAAM_S_RT:0 "$MAAM_RT_SRC$ 재훈련 중. 왼쪽에서 새 유형을 고르세요."
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$전쟁 중입니다."
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$소집된 부대가 있습니다."
 MAAM_S_LIFT:0 "$MAAM_OB_SRC$에서 스택을 집었습니다. 초록색으로 빛나는 연대에서 '놓기'를 클릭하세요."
 MAAM_S_ENDED:0 "$MAAM_OB_SRC$에는 마지막 스택만 남았습니다."
 MAAM_S_ENDED_TT:0 "$MAAM_OB_SRC$에는 마지막 스택만 남았습니다. 받을 수 있는 연대에는 빨간색 '여기에 병합'이 표시되며, '완료'를 누르면 별도의 연대로 남습니다."
 MAAM_S_MERGE:0 "$MAAM_OB_SRC$의 마지막 스택 병합 중."
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · 스택 [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] · [soldiers|E] [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount]#!"
 MAAM_S_SEL_TT:0 "$MAAM_OB_SEL$ 선택됨. 왼쪽에 연대 창이 열리고 아래에 작업이 표시됩니다. 타일을 다시 클릭하거나 ×를 누르면 선택이 해제됩니다."
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$의 규모를 [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]만큼 더 늘릴 수 있습니다."
 MAAM_S_GROW_TT:0 "$MAAM_QM_A$의 규모를 [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]스택 더 늘릴 수 있습니다. 지금 늘릴 수 있는지는 연대 창에서 확인하세요."
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$$MAAM_QM_A$ 연대 두 개를 하나로 합칠 수 있습니다."
 MAAM_S_COMBINE_TT:0 "슬롯이 모두 찼고, $MAAM_QM_A$ 연대 두 개를 하나로 합칠 수 있습니다. 합치면 슬롯이 하나 비지만, 새 연대로 채우기 전까지는 병력이 줄어듭니다. '보여 주기'를 누르면 두 연대를 강조합니다."
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak 칸을 클릭해 스택을 집으세요.#!"
 MAAM_S_IDLE_TT:0 "스택 칸을 클릭해 집은 뒤, 초록색으로 빛나는 같은 유형의 연대에서 '놓기'를 클릭하세요. 연대 줄 끝의 화살표 버튼으로 같은 유형의 연대끼리 [soldiers|E]를 옮길 수 있습니다."
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak 연대를 클릭해 선택하세요.#!"
 MAAM_S_IDLE_TILES_TT:0 "연대를 클릭해 선택하세요. 왼쪽에 연대 창이 열리고, 아래 버튼이 그 연대에 적용됩니다. '다시 묻기'를 누르면 연대를 살펴보고 조언합니다."
 MAAM_S_IDLE_TITLE:0 "#weak 칸을 클릭해 같은 작위 안에서 스택을 옮기세요.#!"
 MAAM_S_IDLE_TITLE_TT:0 "스택 칸을 클릭해 집은 뒤, 초록색으로 빛나는 유형과 작위가 같은 연대에서 '놓기'를 클릭하세요. 연대 줄 끝의 화살표 버튼으로 [soldiers|E]를 옮길 수 있습니다."
 MAAM_S_RES_RETRAINED:0 "@check_icon! [GetVariableSystem.Get( 'maam_rt_old_name' )](을)를 $MAAM_RT_NEW$(으)로 재훈련했습니다. 비용: $MAAM_RT_P_RES$"
 MAAM_S_RES_FAILED:0 "#X [GetVariableSystem.Get( 'maam_rt_old_name' )] 재훈련에 실패했습니다.#! 비용은 들지 않았습니다."

 # Strip, row 2
 MAAM_S_RT_L:0 "완료할 때까지 슬롯 1개가 예약되고 연대가 잠깁니다."
 MAAM_S_BLK_L:0 "스택·[soldiers|E] 이동과 재훈련은 평화를 맺고 모든 부대를 해산한 뒤에 할 수 있습니다."
 MAAM_S_LIFT_L:0 "'놓기' 한 번에 스택 하나."
 MAAM_S_ENDED_L:0 "병합하면 연대가 해산됩니다. 되돌릴 수 없습니다."
 MAAM_S_MERGE_L:0 "병합하면 이 연대는 해산됩니다. 받을 수 있는 연대에 '여기에 병합'이 표시됩니다."
 MAAM_S_RES_DONE_L:0 "규모와 [soldiers|E]는 그대로 옮겨졌습니다. 새 연대는 게임이 새 연대를 두는 위치에 표시됩니다."
 MAAM_S_RES_FAILED_L:0 "그 클릭으로 구매한 것은 모두 제거되고 환급되었습니다."
 MAAM_PREF_LIST:0 "목록"
 MAAM_PREF_GROUPED:0 "유형별"
 MAAM_PREF_TILES:0 "타일"
 MAAM_PREF_SAVED:0 "게임과 함께 저장됩니다."
 MAAM_BACK:0 "스택 되돌리기 ([GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0])"
 MAAM_BACK_TT:0 "가장 최근에 놓은 스택을 원래 집었던 연대로 되돌립니다. 다시 클릭하면 이번 집기에서 놓은 이전 스택도 되돌립니다(최대 10개)."
 MAAM_DONE:0 "완료"
 MAAM_CANCEL:0 "취소"
 MAAM_PUT_DOWN:0 "내려놓기"
 MAAM_PUT_DOWN_TT:0 "집기를 끝냅니다. 이미 놓은 스택은 그대로 남습니다."
 MAAM_ENDED_DONE_TT:0 "마지막 스택을 별도의 연대로 유지합니다."
 MAAM_KEEP_IT:0 "유지"
 MAAM_KEEP_IT_TT:0 "연대를 유지합니다. 병합하지 않습니다."
 MAAM_DESELECT_TT:0 "선택 해제(연대 창 닫기)"
 MAAM_DISMISS_TT:0 "닫기"
 MAAM_RT_CANCEL_TT:0 "재훈련을 끝냅니다. 구매하거나 보유한 것이 없으므로 비용은 들지 않습니다."

 # Moving soldiers
 MAAM_POUR_TT:0 "#T 병사 이동#!\n이 연대를 같은 유형의 다른 연대와 짝짓습니다. 클릭할 때마다 어느 쪽으로든 최대 1스택 분량의 [soldiers|E]가 즉시 이동하며, 첫 스택은 항상 가득 찬 상태로 유지됩니다."
 MAAM_S_POUR_NONE:0 "지금은 이 유형의 다른 연대가 참여할 수 없습니다."
 MAAM_S_POUR_NONE_L:0 "병사를 이동하려면 같은 유형의 연대가 하나 더 필요합니다."
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]에서 [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip](으)로 [soldiers|E] [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]명을 보냅니다.\n#weak 클릭당 최대 1스택이며, 보내는 쪽의 첫 스택은 가득 찬 상태로 유지됩니다.#!"
 MAAM_POUR_TAKE_TT:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]에서 [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip](으)로 [soldiers|E] [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]명을 보냅니다.\n#weak 클릭당 최대 1스택이며, 보내는 쪽의 첫 스택은 가득 찬 상태로 유지됩니다.#!"
 MAAM_POUR_NONE_TT:0 "#X 이 방향으로는 이동할 수 없습니다#!\n보내는 쪽은 첫 스택을 가득 채운 채 유지해야 하고, 받는 쪽에는 빈자리가 있어야 합니다."
 MAAM_POUR_PREV_TT:0 "이 유형의 이전 연대와 짝짓기"
 MAAM_POUR_NEXT_TT:0 "이 유형의 다음 연대와 짝짓기"
 MAAM_POUR_BAR_TT:0 "#weak 파란색: 남는 첫 스택 · 금색: 이동 가능한 [soldiers|E] · 빨간색: 빈자리#!"
 MAAM_POUR_DONE_TT:0 "병사 이동을 끝냅니다. 모든 이동은 이미 적용되었습니다."

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T 규모 [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E] [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak 깃발은 군기이며, 칸 하나가 1스택입니다. 금색: [soldiers|E] · 빨간색: 부족한 [soldiers|E] · 빈칸: 스택을 더 늘릴 자리.#!"
 MAAM_LANE_TITLE_TT:0 "소유 작위: [Regiment.GetOwningTitle.GetName]\n통제 작위: [Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I 이름을 클릭하여 연대 창 열기#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak 재훈련 중에는 잠깁니다.#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T 재훈련 중#!\n이 연대는 무기고에서 재훈련 중입니다."
 MAAM_BADGE_LOANED_TT:0 "#T 대여됨#!\n[Regiment.GetControllingTitle.GetNameNoTooltip]에 대여 중입니다. 돌아올 때까지 변경할 수 없습니다."
 MAAM_BADGE_UNRAISED_TT:0 "#T 미소집#!\n전쟁 중인데 이 연대는 소집되지 않았습니다."
 MAAM_BADGE_UNSTATIONED_TT:0 "#T 주둔군 없음#!\n주둔시킬 수 있는 봉토가 있는데도 이 연대는 주둔하지 않았습니다."
 MAAM_TT_RETRAINING:0 "@alert_icon! #high 무기고에서 재훈련 중#!"
 MAAM_TT_LOANED:0 "@alert_icon! #high 대여됨#!: [Regiment.GetControllingTitle.GetNameNoTooltip]"
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\n군기: 연대의 첫 스택입니다. 단독으로는 옮길 수 없으며, '마지막 스택 병합'으로 연대 전체를 다른 연대에 병합합니다."
 MAAM_PIECE_LIFT_TT:0 "스택을 집은 뒤, 빛나는 같은 유형의 연대에서 '놓기'를 클릭하세요."
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "스택 내려놓기"
 MAAM_PIECE_PLACE_TT:0 "여기에 스택 하나 놓기"
 MAAM_PLACE:0 "놓기"
 MAAM_PLACE_TT:0 "스택 하나를 최대 1스택 분량의 [soldiers|E]와 함께 이 연대로 옮깁니다. 즉시 적용됩니다."
 MAAM_MERGE_HERE:0 "여기에 병합"
 MAAM_MERGE_HERE_TT:0 "#X 병합#!\n마지막 스택과 모든 [soldiers|E]가 이 연대에 합류하고, 다른 연대는 해산됩니다.\n\n#weak 되돌릴 수 없습니다.#!"
 MAAM_LOWER_TT:0 "#X 마지막 스택 병합#!\n이 연대를 같은 유형의 다른 연대에 병합합니다. 받을 수 있는 연대에 '여기에 병합'이 표시됩니다."
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E]: [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]명\n#weak 금색: 병사 · 빨간색: 부족분. 막대가 가득 차면 현재 규모의 최대 군사력입니다.#!"
 MAAM_BLOCKED_TT:0 "#X 지금은 불가#!\n스택·[soldiers|E] 이동과 재훈련은 평화를 맺고 모든 부대를 해산한 뒤에 할 수 있습니다."
 MAAM_RETRAIN_TT:0 "다른 유형으로 재훈련합니다. 무기고가 열리면 유형을 클릭해 정확한 비용을 확인한 뒤 '재훈련'을 누르세요."
 MAAM_RETRAIN_BLOCKED_TT:0 "#X 지금은 이 연대를 재훈련할 수 없습니다#!\n직접 소유하고 통제하는 미소집 연대여야 합니다. 평화 상태에서 소집된 부대가 없어야 하며, 진행 중인 다른 재훈련이 없어야 합니다."
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "먼저 모집 창을 닫으세요."
 MAAM_RETRAIN_TITLE_TT:0 "#X 사용 불가#!\n작위 연대는 아직 무기고에서 재훈련할 수 없습니다."
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X 사용 불가#!\n재훈련하려면 평화 상태여야 하고 소집된 부대가 없어야 합니다."
 MAAM_SEL_LIFT:0 "스택 집기"
 MAAM_SEL_POUR:0 "병사 이동"
 MAAM_SEL_RETRAIN:0 "재훈련"
 MAAM_SEL_LOWER:0 "마지막 스택 병합"
 MAAM_SEL_LIFT_TT:0 "#T 스택 집기#!\n스택 하나를 집습니다. 초록색으로 빛나는 같은 유형의 연대를 클릭하면 그곳에 놓입니다. 즉시 적용됩니다."
 MAAM_SEL_LIFT_LONE_TT:0 "#X 마지막 스택만 남았습니다#!\n'마지막 스택 병합'으로 같은 유형의 다른 연대에 병합하세요."
 MAAM_SEL_BLOCKED_TT:0 "#X 지금은 이 연대에 사용할 수 없습니다#!"
 MAAM_SEL_NONE_TT:0 "먼저 타일을 클릭해 연대를 선택하세요."
 MAAM_LOWER_BIG_TT:0 "#X 마지막 스택 병합#!\n스택이 하나만 남았을 때만 가능합니다. 먼저 나머지 스택을 집어 같은 유형의 연대로 옮기세요."
 MAAM_PAIRED:0 "짝"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "개 연대"
 MAAM_GROUP_REGIMENT:0 "개 연대"
 MAAM_GROUP_FOLD_TT:0 "이 그룹 접기/펼치기"
 MAAM_GROUP_FROZEN_TT:0 "작업이 진행 중인 동안에는 그룹이 그대로 유지됩니다."

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "목록: 게임 기본 순서\n#weak 다음에 군사 창을 열 때도 유지됩니다.#!"
