l_korean:
 # Muster board (Military window, Men-at-Arms area)
 # English text until translated.
 MAAM_TILE_CLICK_HINT:0 "#weak Click to select. Glowing regiments can be paired with the selected one.#!"
 MAAM_TILE_LOCKED_HINT:0 "#weak Locked while a retrain is running.#!"
 MAAM_ROLE_SELECTED:0 "Selected"
 MAAM_ROLE_PARTNER:0 "Partner"
 MAAM_ROLE_RETRAINING:0 "Retraining"
 MAAM_ROLE_TEST:0 "Test stack"
 MAAM_SLOT_RESERVED:0 "1 slot reserved for retraining"
 MAAM_CREATE_BLOCKED_TT:0 "#X Not while retraining#!\nA retrain is holding a temporary regiment slot. Finish or cancel it on the bench first."

 MAAM_BENCH_TITLE:0 "Bench"
 MAAM_BENCH_HINT:0 "stacks move at once, soldiers wait for Transfer"
 MAAM_BENCH_CLOSE_TT:0 "Close the bench"
 MAAM_BENCH_BLOCKED:0 "Make peace and lower all armies to reorganize [men_at_arms|E]."
 MAAM_BENCH_LOANED:0 "[Regiment.GetNameNoTooltip] is loaned to [Regiment.GetControllingTitle.GetNameNoTooltip]. Changes wait until it returns."
 MAAM_BENCH_PICK_PARTNER:0 "Click a glowing regiment of the same type to pair it."
 MAAM_BENCH_PICK_PARTNER_TITLE:0 "Click a glowing regiment of the same type and title to pair it."
 MAAM_BENCH_UNPAIR_TT:0 "Unpair"

 MAAM_MINI_LINE:0 "Size [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] · [Regiment.BuildCurrentRegimentCountString] [soldiers|E]"
 MAAM_MINI_STATIONED:0 "Stationed in [Regiment.GetOriginProvince.GetName]"

 MAAM_BENCH_GIVE:0 "Give 1 · [Regiment.GetMAAChunkCount]→[Subtract_int32( Regiment.GetMAAChunkCount, '(int32)1' )] »"
 MAAM_BENCH_TAKE:0 "« Take 1 · [Regiment.GetMAAChunkCount]→[Add_int32( Regiment.GetMAAChunkCount, '(int32)1' )]"
 MAAM_BENCH_GIVE_TT:0 "Give 1 stack, with up to one stack of [soldiers|E], from the selected regiment to the partner.\n\n#weak This happens at once. The selected regiment's last stack can only leave through Merge.#!"
 MAAM_BENCH_TAKE_TT:0 "Take 1 stack, with up to one stack of [soldiers|E], from the partner into the selected regiment.\n\n#weak This happens at once. The partner's last stack can only leave through Merge.#!"
 MAAM_BENCH_STACK_RULE:0 "Plan [soldiers|E] with the arrows, then Transfer."
 MAAM_BENCH_UNDO:0 "Move the stack back"
 MAAM_BENCH_UNDO_TT:0 "Moves the last stack back at once. Merges cannot be undone."

 MAAM_BENCH_SOLDIERS:0 "[soldiers|E]"
 MAAM_PLAN_RIGHT:0 "[GetPlayer.MakeScope.Var('maa_total_planned_transfers').GetValue|0] »"
 MAAM_PLAN_LEFT:0 "« [Subtract_int32( '(int32)0', FixedPointToInt( GetPlayer.MakeScope.Var('maa_total_planned_transfers').GetValue ) )]"
 MAAM_PLAN_ZERO:0 "0"
 MAAM_BENCH_SOLDIERS_LEFT_TT:0 "Plan one stack's worth of [soldiers|E] more toward the selected regiment"
 MAAM_BENCH_SOLDIERS_RIGHT_TT:0 "Plan one stack's worth of [soldiers|E] more toward the partner"
 MAAM_BENCH_FILL_SELECTED:0 "« Fill"
 MAAM_BENCH_FILL_SELECTED_TT:0 "Fill selected: plan as many [soldiers|E] as the selected regiment can take from the partner"
 MAAM_BENCH_FILL_PARTNER:0 "Fill »"
 MAAM_BENCH_FILL_PARTNER_TT:0 "Fill partner: plan as many [soldiers|E] as the partner can take from the selected regiment"
 MAAM_BENCH_SEND:0 "Transfer"
 MAAM_BENCH_SEND_TT:0 "Move the planned [soldiers|E] now. Regiment sizes stay the same."
 MAAM_BENCH_PREVIEW:0 "Selected [GetPlayer.MakeScope.Var('maa_manager_selected_regiment_scope').Regiment.CalcMenAliveCount] → [Subtract_int32( GetPlayer.MakeScope.Var('maa_manager_selected_regiment_scope').Regiment.CalcMenAliveCount, FixedPointToInt( GetPlayer.MakeScope.Var('maa_total_planned_transfers').GetValue ) )] · Partner [GetPlayer.MakeScope.Var('maa_manager_selected_target_scope').Regiment.CalcMenAliveCount] → [Add_int32( GetPlayer.MakeScope.Var('maa_manager_selected_target_scope').Regiment.CalcMenAliveCount, FixedPointToInt( GetPlayer.MakeScope.Var('maa_total_planned_transfers').GetValue ) )] · [SelectLocalization( GetPlayer.GetGovernment.HasRule( 'conditional_maa_refill' ), 'MAAM_REFILL_CONDITIONAL', 'MAAM_REFILL_NORMAL' )]"
 MAAM_REFILL_NORMAL:0 "#weak understrength regiments refill over time#!"
 MAAM_REFILL_CONDITIONAL:0 "#weak refills only with Refill [men_at_arms|E]#!"

 MAAM_BENCH_MERGE_INTO:0 "#bold Merge into partner#!\nThe selected regiment is disbanded. Final."
 MAAM_BENCH_MERGE_INTO_TT:0 "#X Merge#!\nThe selected regiment's last stack and all its [soldiers|E] join the partner. The selected regiment is disbanded.\n\n#weak This cannot be undone.#!"
 MAAM_BENCH_MERGE_IN:0 "#bold Merge partner in#!\nThe partner is disbanded. Final."
 MAAM_BENCH_MERGE_IN_TT:0 "#X Merge#!\nThe partner's last stack and all its [soldiers|E] join the selected regiment. The partner is disbanded.\n\n#weak This cannot be undone.#!"

 MAAM_BENCH_RETRAIN:0 "Retrain…"
 MAAM_BENCH_RETRAIN_TT:0 "Retrain the selected regiment into another type.\n\nYour real prices are read by buying one test stack of the current type (refunded at once) and one of the new type (held until you confirm or cancel). Keep the game paused."
 MAAM_BENCH_RETRAIN_BLOCKED_TT:0 "#X Cannot retrain this regiment now#!\nIt must be yours and under your control, unraised and not stationed (retraining recreates the regiment, so remove its station first). You must be at peace with nothing raised, and no other retrain may be running."
 MAAM_BENCH_RETRAIN_LEGACY:0 "Open retrain list…"
 MAAM_BENCH_RETRAIN_LEGACY_TT:0 "Opens the [men_at_arms|E] Manager's retrain list for this regiment."

 # Retrain on the bench (ledger and receipt)
 MAAM_RT_TITLE:0 "Retraining [Regiment.GetNameNoTooltip]"
 MAAM_RT_YOUR_PRICE:0 "your price per stack"
 MAAM_RT_NEW_TYPE:0 "New type"
 MAAM_RT_AFTER_YOUR_PRICE:0 "after your current price"
 MAAM_RT_OPEN_PICKER_QUOTE:0 "Buy test stack in picker…"
 MAAM_RT_OPEN_PICKER_TARGET:0 "Choose new type…"
 MAAM_RT_OPEN_PICKER_TARGET_TT:0 "Opens the recruitment window with every type you can recruit."
 MAAM_RT_QUOTE_EXPIRED:0 "#X Your price check expired#!\nTime passed since the current price was read. Cancel the retrain and start again."
 MAAM_RT_WAITING:0 "Waiting for the purchase…"
 MAAM_RT_CONTINUE:0 "Continue"
 MAAM_RT_CONTINUE_TT:0 "Read the purchase now"
 MAAM_RT_UNPEND:0 "Nothing bought"
 MAAM_RT_UNPEND_TT:0 "The purchase did not go through. Nothing changed; try again."
 MAAM_RT_RECORD:0 "Record price and refund"
 MAAM_RT_RECORD_TT:0 "Stores what one stack costs you, removes the test stack and refunds it."
 MAAM_RT_PRICE_SOURCE:0 "@gold_icon! [GetPlayer.MakeScope.Var('maam_rt_source_price').GetValue|0] @check_icon!"
 MAAM_RT_PRICE_TARGET:0 "@gold_icon! [GetPlayer.MakeScope.Var('maam_rt_gold_paid').GetValue|0] @check_icon!"
 MAAM_RT_DIFFERENCE:0 "Difference, at least [GetPlayer.MakeScope.Var('maam_rt_floor').GetValue|0], × [GetPlayer.MakeScope.Var('maam_rt_size').GetValue|0] stacks"
 MAAM_RT_DIFFERENCE_VALUE:0 "@gold_icon! [GetPlayer.MakeScope.ScriptValue('maam_rt_preview_difference_value')|0] × [GetPlayer.MakeScope.Var('maam_rt_size').GetValue|0]"
 MAAM_RT_FEE:0 "Retrain fee"
 MAAM_RT_FEE_VALUE:0 "@gold_icon! [GetPlayer.MakeScope.ScriptValue('maam_rt_preview_fee_value')|0]"
 MAAM_RT_STILL_TO_PAY:0 "Still to pay (#weak [GetPlayer.MakeScope.Var('maam_rt_gold_paid').GetValue|0] already paid for the held stack#!)"
 MAAM_RT_GET_BACK:0 "You get back (#weak [GetPlayer.MakeScope.Var('maam_rt_gold_paid').GetValue|0] already paid for the held stack#!)"
 MAAM_RT_REMAINING_VALUE:0 "@gold_icon! [GetPlayer.MakeScope.ScriptValue('maam_rt_preview_remaining_abs_value')|0]"
 MAAM_RT_CARRY_OVER:0 "Size and [soldiers|E] carry over. The regiment's custom name, experience and station do not."
 MAAM_RT_CANCEL:0 "Cancel retrain"
 MAAM_RT_CANCEL_REFUND:0 "Cancel and refund [GetPlayer.MakeScope.Var('maam_rt_gold_paid').GetValue|0]"
 MAAM_RT_CANCEL_REFUND_TT:0 "Removes the bought test stack and refunds what was paid for it. The original regiment is not touched."
 MAAM_RT_COMMIT_PAY:0 "Retrain · pay [GetPlayer.MakeScope.ScriptValue('maam_rt_preview_remaining_abs_value')|0] more"
 MAAM_RT_COMMIT_REFUND:0 "Retrain · get [GetPlayer.MakeScope.ScriptValue('maam_rt_preview_remaining_abs_value')|0] back"
 MAAM_RT_COMMIT_UNAFFORDABLE_TT:0 "#X Not enough gold for the fee.#!\nYou need @gold_icon! [GetPlayer.MakeScope.ScriptValue('maam_rt_preview_remaining_abs_value')|0] more. Cancel and refund, or come back with more gold before time passes."
 MAAM_RT_COMMIT_TT:0 "Grows the new regiment to the old one's size and [soldiers|E], settles the fee, then disbands the old regiment.\n\n#weak The old regiment is removed only after every check passes.#!"
 MAAM_RT_KEEP_PAUSED:0 "#weak Keep the game paused until you finish.#!"
 MAAM_RT_PAUSE_FIRST:0 "#X Pause the game to retrain.#!"
 MAAM_RT_INTERRUPTED:0 "Time passed during the retrain, so its price checks are no longer trusted."
 MAAM_RT_RECOVER:0 "Recover the payment"
 MAAM_RT_RECOVER_TT:0 "Removes the bought test stack and refunds its recorded price on top of your current gold."
 MAAM_RT_ABANDON:0 "End retrain, keep regiments"
 MAAM_RT_ABANDON_TT:0 "Ends the retrain without refunds. Any bought regiment stays yours. Nothing is guessed."
 MAAM_RT_CAPTURE_FAILED:0 "The purchase could not be verified (for example, it was not paid in gold). Retraining cannot continue."
 MAAM_RT_RELEASE:0 "End retrain, keep the regiment"
 MAAM_RT_RELEASE_TT:0 "Ends the retrain. What was bought stays yours; nothing is refunded."
 MAAM_RT_RESULT_RETRAINED:0 "Retrained. The fee was @gold_icon! [GetPlayer.MakeScope.Var('maam_rt_result_fee').GetValue|0]."
 MAAM_RT_RESULT_ROLLED_BACK:0 "Retrain cancelled. @gold_icon! [GetPlayer.MakeScope.Var('maam_rt_result_refund').GetValue|0] refunded."
 MAAM_RT_RESULT_CANCELLED:0 "Retrain cancelled. Nothing was bought."
 MAAM_RT_RESULT_UNAFFORDABLE:0 "#X Not enough gold for the fee.#! The test stack was removed and refunded."
 MAAM_RT_RESULT_FAILED:0 "#X Retraining could not be completed.#! The original regiment was kept and the purchase refunded."
 MAAM_RT_RESULT_RECOVERED:0 "Payment recovered. @gold_icon! [GetPlayer.MakeScope.Var('maam_rt_result_refund').GetValue|0] refunded."
 MAAM_RT_RESULT_RELEASED:0 "Retrain ended. The bought regiment was kept."
 MAAM_RT_RESULT_ABANDONED:0 "Retrain ended without changes to gold or regiments."

 # Recruitment window in retrain mode
 MAAM_RT_NATIVE_PICKER_TITLE:0 "[MenAtArmsTypeView.GetTitle]"
 MAAM_RT_PICKER_TITLE:0 "Retrain [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]"
 MAAM_RT_PICKER_SOURCE:0 "Retraining [Regiment.GetNameNoTooltip] · Size [Regiment.GetMAAChunkCount] · [Regiment.BuildCurrentRegimentCountString] [soldiers|E]"
 MAAM_RT_PICKER_HINT_QUOTE:0 "First read your current price: select it below and buy one test stack. If it is not listed, it cannot be recruited now, so it cannot be retrained."
 MAAM_RT_PICKER_HINT_TARGET:0 "Choose the new type and buy one stack of it. It is held until you retrain or cancel."
 MAAM_RT_BUY:0 "Buy 1 [MenAtArmsType.GetNameNoTooltip] stack · [MenAtArmsTypeView.GetCostString( GetPlayer )]"
 MAAM_RT_BUY_QUOTE_NOTE:0 "Reads your real price. The bench refunds it in the next step."
 MAAM_RT_BUY_TARGET_NOTE:0 "Held until you retrain or cancel on the bench."
 MAAM_RT_STACK_DIFFERS:0 "#X Not supported yet:#! this type has a different number of [soldiers|E] per stack."
 MAAM_RT_CANNOT_BUY:0 "#X You cannot recruit this type right now.#! Its price can't be read, so it can't be used for retraining."
 MAAM_RT_DELTAS:0 "Compared with [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]: damage [Subtract_CFixedPoint( MenAtArmsType.GetStat( GetPlayer, Province.Self, Title.Self, 'damage' ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStat( GetPlayer, Province.Self, Title.Self, 'damage' ) )|0+=], toughness [Subtract_CFixedPoint( MenAtArmsType.GetStat( GetPlayer, Province.Self, Title.Self, 'toughness' ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStat( GetPlayer, Province.Self, Title.Self, 'toughness' ) )|0+=], pursuit [Subtract_CFixedPoint( MenAtArmsType.GetStat( GetPlayer, Province.Self, Title.Self, 'pursuit' ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStat( GetPlayer, Province.Self, Title.Self, 'pursuit' ) )|0+=], screen [Subtract_CFixedPoint( MenAtArmsType.GetStat( GetPlayer, Province.Self, Title.Self, 'screen' ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStat( GetPlayer, Province.Self, Title.Self, 'screen' ) )|0+=]"

 # Modifier
 maam_rt_slot_modifier:0 "Retraining Men-at-Arms"
 maam_rt_slot_modifier_desc:0 "One temporary regiment slot while the Men-at-Arms Manager reads retrain prices."
