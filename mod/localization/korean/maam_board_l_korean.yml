 MAAM_RT_CUR_NONGOLD:0 " · #X 가격 미확인#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T 새 가격의 절반인 이유#!\n가격은 같은 클릭 안에서 1스택을 구매하고 환급하여 확인합니다. [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] 구매에 금화와 국고가 모두 쓰여 가격을 구분할 수 없습니다. 그래서 비용은 새 유형의 스택당 가격의 절반입니다(최소 비용은 그대로 적용)."
