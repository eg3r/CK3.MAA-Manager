l_english:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high Quartermaster#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high Board settings#! · Default view when the Military window opens."
 MAAM_S_RT:0 "Retraining $MAAM_RT_SRC$. Pick the new type on the left."
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$At war."
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$An army is raised."
 MAAM_S_LIFT:0 "Lifted a stack from $MAAM_OB_SRC$. Click Place on a regiment that glows green."
 MAAM_S_ENDED:0 "Only the last stack of $MAAM_OB_SRC$ is left."
 MAAM_S_ENDED_TT:0 "Only the last stack of $MAAM_OB_SRC$ is left. Regiments that can take it show the red Merge here; Done keeps it as its own regiment."
 MAAM_S_MERGE:0 "Merging the last stack of $MAAM_OB_SRC$."
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] stacks · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount] [soldiers|E]#!"
 MAAM_S_SEL_TT:0 "$MAAM_OB_SEL$ is selected and its regiment window is open on the left. Its actions are below; click the tile again or the × to deselect."
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$ has room for [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )] more."
 MAAM_S_GROW_TT:0 "$MAAM_QM_A$ has room to grow by [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )] stacks. Its regiment window shows whether you can increase it now."
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$Two $MAAM_QM_A$ regiments fit in one."
 MAAM_S_COMBINE_TT:0 "All slots are used, and two $MAAM_QM_A$ regiments fit in one. Combining frees a slot; until you fill it with a new regiment, your army is smaller. Show me highlights both."
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak Click a piece to lift a stack.#!"
 MAAM_S_IDLE_TT:0 "Click a stack piece to lift it, then click Place on a regiment of the same type that glows green. The arrows button at the end of a regiment's row moves [soldiers|E] between regiments of the same type."
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak Click a regiment to select it.#!"
 MAAM_S_IDLE_TILES_TT:0 "Click a regiment to select it: its regiment window opens on the left and the buttons below act on it. Ask again looks at your regiments for tips."
 MAAM_S_IDLE_TITLE:0 "#weak Click a piece to move a stack within its title.#!"
 MAAM_S_IDLE_TITLE_TT:0 "Click a stack piece to lift it, then click Place on a regiment of the same type and title that glows green. The arrows button at the end of a regiment's row moves [soldiers|E]."
 MAAM_S_RES_RETRAINED:0 "@check_icon! [GetVariableSystem.Get( 'maam_rt_old_name' )] retrained into $MAAM_RT_NEW$ for $MAAM_RT_P_RES$"
 MAAM_S_RES_FAILED:0 "#X Failed to retrain [GetVariableSystem.Get( 'maam_rt_old_name' )].#! Nothing was spent."

 # Strip, row 2
 MAAM_S_RT_L:0 "1 slot reserved and regiments locked until you finish."
 MAAM_S_BLK_L:0 "Moving stacks, [soldiers|E] and retraining wait until you make peace and lower all armies."
 MAAM_S_LIFT_L:0 "One stack per Place."
 MAAM_S_ENDED_L:0 "Merging disbands the regiment. Final."
 MAAM_S_MERGE_L:0 "Merging disbands it. Regiments that can take it show Merge here."
 MAAM_S_RES_DONE_L:0 "Size and [soldiers|E] carried over. The new regiment sits where the game lists new regiments."
 MAAM_S_RES_FAILED_L:0 "Everything bought in that click was removed and refunded."
 MAAM_PREF_LIST:0 "List"
 MAAM_PREF_GROUPED:0 "Grouped"
 MAAM_PREF_TILES:0 "Tiles"
 MAAM_PREF_SAVED:0 "Saved with your game."
 MAAM_BACK:0 "Move a stack back ([GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0])"
 MAAM_BACK_TT:0 "Moves the newest placed stack back into the regiment you lifted it from. Click again to undo earlier placements of this lift (up to 10)."
 MAAM_DONE:0 "Done"
 MAAM_CANCEL:0 "Cancel"
 MAAM_PUT_DOWN:0 "Put down"
 MAAM_PUT_DOWN_TT:0 "Ends the lift. Stacks already placed stay where they are."
 MAAM_ENDED_DONE_TT:0 "Keeps the last stack as its own regiment."
 MAAM_KEEP_IT:0 "Keep it"
 MAAM_KEEP_IT_TT:0 "Keeps the regiment. Nothing is merged."
 MAAM_DESELECT_TT:0 "Deselect (closes its regiment window)"
 MAAM_DISMISS_TT:0 "Dismiss"
 MAAM_RT_CANCEL_TT:0 "Ends the retrain. Nothing was bought or held, so nothing is spent."

 # Moving soldiers
 MAAM_POUR_TT:0 "#T Move soldiers#!\nPairs this regiment with another of the same type. Each click moves up to one stack of [soldiers|E] either way, at once; the first stack always stays full."
 MAAM_S_POUR_NONE:0 "No other regiment of this type can take part right now."
 MAAM_S_POUR_NONE_L:0 "Moving soldiers needs a second regiment of the same type."
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "Send [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] from [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] to [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip].\n#weak At most one stack per click; the sender keeps its first stack full.#!"
 MAAM_POUR_TAKE_TT:0 "Send [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] from [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] to [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip].\n#weak At most one stack per click; the sender keeps its first stack full.#!"
 MAAM_POUR_NONE_TT:0 "#X Nothing can move this way#!\nThe sender keeps its first stack full, and the receiver needs room."
 MAAM_POUR_PREV_TT:0 "Pair with the previous regiment of this type"
 MAAM_POUR_NEXT_TT:0 "Pair with the next regiment of this type"
 MAAM_POUR_BAR_TT:0 "#weak Blue: the first stack, which stays · gold: [soldiers|E] that can move · red: room#!"
 MAAM_POUR_DONE_TT:0 "Ends moving soldiers. Every move already happened."

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T Size [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E] [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak The flag is the standard, each square one stack. Gold: [soldiers|E] · red: missing [soldiers|E] · empty: room for another stack.#!"
 MAAM_LANE_STATIONED:0 "Stationed in [Regiment.GetOriginProvince.GetName]"
 MAAM_LANE_TITLE_TT:0 "Owning title: [Regiment.GetOwningTitle.GetName]\nControlling title: [Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I Click the name to open the regiment window#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak Locked while a retrain is open.#!"
 MAAM_TILE_CLICK_HINT:0 "#I Click to select and open the regiment window#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T Retraining#!\nThis regiment is being retrained in the armory."
 MAAM_BADGE_LOANED_TT:0 "#T Loaned#!\nLoaned to [Regiment.GetControllingTitle.GetNameNoTooltip]. Changes wait until it returns."
 MAAM_BADGE_UNRAISED_TT:0 "#T Unraised#!\nYou are at war and this regiment is not raised."
 MAAM_BADGE_UNSTATIONED_TT:0 "#T Unstationed#!\nThis regiment has no station although you have provinces that could host one."
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\nThe standard: the regiment's first stack. It never moves on its own; Merge last stack merges the whole regiment into another."
 MAAM_PIECE_LIFT_TT:0 "Lift a stack, then click Place on a glowing regiment of the same type."
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "Put the stack down"
 MAAM_PIECE_PLACE_TT:0 "Place one stack here"
 MAAM_PLACE:0 "Place"
 MAAM_PLACE_TT:0 "Moves one stack, with up to one stack of [soldiers|E], into this regiment. Happens at once."
 MAAM_MERGE_HERE:0 "Merge here"
 MAAM_MERGE_HERE_TT:0 "#X Merge#!\nThe last stack and all its [soldiers|E] join this regiment, and the other regiment is disbanded.\n\n#weak This cannot be undone.#!"
 MAAM_LOWER_TT:0 "#X Merge last stack#!\nMerges this regiment into another of the same type. Regiments that can take it show Merge here."
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E]: [Regiment.CalcMenAliveCount] of [Regiment.GetMaxCount]\n#weak Gold: soldiers · red: missing. Full bar = full strength at this size.#!"
 MAAM_BLOCKED_TT:0 "#X Not now#!\nMoving stacks, [soldiers|E] and retraining wait until you make peace and lower all armies."
 MAAM_RETRAIN_TT:0 "Retrain into another type. Opens the armory: click a type to see its exact fee, then press Retrain."
 MAAM_RETRAIN_BLOCKED_TT:0 "#X Can't retrain this regiment now#!\nIt must be yours and under your control, and unraised. You must be at peace with nothing raised, and no other retrain may be open."
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "Close the recruitment window first."
 MAAM_RETRAIN_TITLE_TT:0 "#X Not available#!\nTitle regiments can't be retrained in the armory yet."
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X Not available#!\nRetraining needs peace and no raised armies."
 MAAM_SEL_LIFT:0 "Lift a stack"
 MAAM_SEL_POUR:0 "Move soldiers"
 MAAM_SEL_RETRAIN:0 "Retrain"
 MAAM_SEL_LOWER:0 "Merge last stack"
 MAAM_SEL_LIFT_TT:0 "#T Lift a stack#!\nLifts one stack; then click a regiment of the same type that glows green to place it there. Happens at once."
 MAAM_SEL_LIFT_LONE_TT:0 "#X Only the last stack is left#!\nUse Merge last stack to merge it into another regiment of the same type."
 MAAM_SEL_BLOCKED_TT:0 "#X Not available for this regiment right now#!"
 MAAM_SEL_NONE_TT:0 "Select a regiment first: click its tile."
 MAAM_LOWER_BIG_TT:0 "#X Merge last stack#!\nOnly when one stack is left. Lift its other stacks into regiments of the same type first."
 MAAM_PAIRED:0 "Paired"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "regiments"
 MAAM_GROUP_REGIMENT:0 "regiment"
 MAAM_GROUP_FOLD_TT:0 "Fold or show this group"
 MAAM_GROUP_FROZEN_TT:0 "Groups stay as they are while an action is open."

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "List: the game's own order\n#weak Remembered for the next time you open the Military window.#!"
 MAAM_VIEW_GROUPED_TT:0 "Grouped by type, with a count per type\n#weak Remembered for the next time you open the Military window.#!"
 MAAM_VIEW_TILES_TT:0 "Tiles, like the base game\n#weak Remembered for the next time you open the Military window.#!"
 MAAM_VIEW_LOCKED_TT:0 "The view stays while an action is open."
 MAAM_SETTINGS_TT:0 "Not yet implemented"

 # Quartermaster
 MAAM_QM_OPEN:0 "Open regiment"
 MAAM_QM_OPEN_TT:0 "Opens its regiment window, with the game's own Increase Size button."
 MAAM_QM_SHOW:0 "Show me"
 MAAM_QM_SHOW_TT:0 "Highlights both regiments."
 MAAM_QM_NEXT:0 "Next tip"
 MAAM_QM_ASK:0 "Ask again"
 MAAM_QM_ASK_TT:0 "Looks at your regiments again."
 MAAM_CREATE_BLOCKED_TT:0 "#X Not while retraining#!\nA retrain is holding a temporary regiment slot. Finish or cancel it first."

 # Armory (recruitment window in retrain mode)
 MAAM_RT_PICKER_TITLE:0 "Retrain Men-at-Arms"
 MAAM_RT_CUR_INFO:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] stacks · [Regiment.GetMAAType.GetBaseTypeName]"
 MAAM_RT_CUR_STATIONED:0 "#X Stationed in [Regiment.GetOriginProvince.GetName]:#! station it again after retraining."
 MAAM_RT_CUR_PRICE:0 " · $MAAM_RT_P_SRC$"
 MAAM_RT_CUR_PRICE_TT:0 "Your price per stack of this type, read when the armory opened. Each retrain fee is worked out from it."
 MAAM_RT_CUR_UNLISTED:0 " · #X price unread#!"
 MAAM_RT_CUR_UNLISTED_TT:0 "#T Why half the new price#!\nThe armory reads your price by buying one stack of [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] and refunding it when it opens (paused). That wasn't possible: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] isn't in your recruitment list now (its requirements, such as a culture or innovation, are no longer met), or the check couldn't run. Instead the fee is half the new type's price."
 MAAM_RT_CUR_REFUSED:0 " · #X not for sale now#!"
 MAAM_RT_CUR_REFUSED_TT:0 "#T Why half the new price#!\nPrices are read by buying one stack and refunding it in the same click. The game refused to sell [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] just now, so there is no price to read. Instead the fee is half the new type's price."
 MAAM_RT_CUR_NONGOLD:0 " · #X price unread#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T Why half the new price#!\nPrices are read by buying one stack and refunding it in the same click. Buying [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] took both gold and treasury, so its price can't be told apart. The fee is half the new type's price per stack instead (the minimum still applies)."
 MAAM_RT_CUR_ROW:0 "[MenAtArmsType.GetNameNoTooltip] · your type, reading its price"
 MAAM_RT_CUR_ROW_TT:0 "Your regiment's current type. Its price is read once when the armory opens (paused): one stack is bought and refunded at once, then this row disappears."
 MAAM_RT_CUR_UNKNOWN:0 " · #weak reading price…#!"
 MAAM_RT_CUR_UNKNOWN_TT:0 "Your price for this type is read once when the armory opens, while the game is paused. Pause the game if it doesn't appear."
 MAAM_RT_ROLE_ALL:0 "All"
 MAAM_RT_ROLE_ALL_TT:0 "Show every type you could retrain into."
 MAAM_RT_ROLE_TT:0 "Show [MenAtArmsType.GetBaseTypeName] only"
 MAAM_RT_ROLE_ON_TT:0 "Show all types again"
 MAAM_RT_STACK_LINE:0 "[soldiers|E] per stack [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStackSize] → [MenAtArmsType.GetStackSize]: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] of [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] become [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] of [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]"
 MAAM_RT_STACK_LINE_TT:0 "#T Another number of [soldiers|E] per stack#!\nThe new regiment keeps its size and how full it is: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] of [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] [soldiers|E] become [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] of [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]. Missing [soldiers|E] reinforce as usual."
 MAAM_RT_PAUSE_FIRST:0 "#X Pause the game to retrain.#! Prices are only checked while paused."
 MAAM_RT_HINT:0 "Select a target from the list to retrain into."
 MAAM_RT_TGT_REFUSED:0 "#high [GetVariableSystem.Get( 'maam_rt_name' )]#! could not be bought. Nothing was spent."
 MAAM_RT_HEADER:0 "[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] → [GetVariableSystem.Get( 'maam_rt_name' )]"
 MAAM_RT_UPKEEP_LINE:0 "Upkeep per stack: [MenAtArmsType.GetFullStrengthMaintenanceCostForPlayerString]"
 MAAM_RT_UPKEEP_TT:0 "#T Upkeep per stack, full strength#!\n[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetFullStrengthMaintenanceCostForPlayerString]\n[MenAtArmsType.GetNameNoTooltip]: [MenAtArmsType.GetFullStrengthMaintenanceCostForPlayerString]"
 MAAM_RT_FEE_LABEL:0 "Retrain fee"
 MAAM_RT_FEE_HOW:0 "$MAAM_RT_P_TGT$− $MAAM_RT_P_SRC$per stack, at least [GetPlayer.Custom('maam_rt_cost_floor')], × [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount] stacks"
 MAAM_RT_FEE_HOW_FALLBACK:0 "Half of $MAAM_RT_P_TGT$per stack, at least [GetPlayer.Custom('maam_rt_cost_floor')], × [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount] stacks"
 MAAM_RT_FEE_HOW_CONVERTED:0 "$MAAM_RT_P_TGT$− your type [GetPlayer.Custom('maam_rt_cost_credit')] per stack, at least [GetPlayer.Custom('maam_rt_cost_floor')], × [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount] stacks"
 MAAM_RT_FEE_VALUE:0 "$MAAM_RT_P_FEE$"
 MAAM_RT_GO:0 "Retrain"
 MAAM_RT_NEED:0 "You need $MAAM_RT_P_FEE$"
 MAAM_RT_GO_TT:0 "One click: buys the new type, carries the size and how full it is with [soldiers|E] over, settles to exactly this fee, then removes the old regiment.\n\n#weak If anything fails, everything bought in the click is removed and refunded. A station does not carry over.#!"
 MAAM_RT_FALLBACK_NOTE:0 "#weak Your current type can't be bought right now, so the fee is half the new price.#!"
 MAAM_RT_CONVERTED_NOTE:0 "#weak Your current type is paid in another currency: its price counts at Men-at-Arms rates (1 gold = [GetPlayer.MakeScope.ScriptValue('maam_rt_rate_piety_value')|1] piety = 2 prestige).#!"
 MAAM_RT_SHORT_NOTE:0 "#X You have $MAAM_RT_P_HAVE$#!"
 MAAM_RT_UPFRONT_NOTE:0 "#X Buying needs the new type's price up front:#! $MAAM_RT_P_TGT$for one stack. The difference comes back in the same click."
 MAAM_RT_RESELECTING:0 "#weak Selecting the priced type…#!"

 # Modifier
 maam_rt_slot_modifier:0 "Retraining Men-at-Arms"
 maam_rt_slot_modifier_desc:0 "One temporary regiment slot while the Men-at-Arms Manager reads retrain prices."

