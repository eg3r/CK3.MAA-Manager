l_french:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high Fourrier#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high Réglages du tableau#! · Vue par défaut de la fenêtre Militaire."
 MAAM_S_RT:0 "Réentraînement de $MAAM_RT_SRC$ : choisissez le type à gauche."
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$En guerre."
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$Une armée est levée."
 MAAM_S_LIFT:0 "Pile prise dans $MAAM_OB_SRC$. Cliquez sur « Placer » d’un régiment en vert."
 MAAM_S_ENDED:0 "Il ne reste que la dernière pile de $MAAM_OB_SRC$."
 MAAM_S_ENDED_TT:0 "Il ne reste que la dernière pile de $MAAM_OB_SRC$. Les régiments qui peuvent l’accueillir affichent le bouton rouge « Fusionner ici » ; « Terminé » la garde comme régiment à part entière."
 MAAM_S_MERGE:0 "Fusion de la dernière pile de $MAAM_OB_SRC$."
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] piles · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount] [soldiers|E]#!"
 MAAM_S_SEL_TT:0 "$MAAM_OB_SEL$ est sélectionné et sa fenêtre de régiment est ouverte à gauche. Ses actions sont ci-dessous ; cliquez à nouveau sur la vignette ou sur × pour le désélectionner."
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$ peut encore grandir de [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )]."
 MAAM_S_GROW_TT:0 "$MAAM_QM_A$ peut encore grandir de [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )] piles. Sa fenêtre de régiment indique si vous pouvez l’augmenter maintenant."
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$Deux régiments $MAAM_QM_A$ tiennent en un seul."
 MAAM_S_COMBINE_TT:0 "Tous les emplacements sont occupés, et deux régiments $MAAM_QM_A$ tiennent en un seul. Les combiner libère un emplacement ; tant que vous ne le remplissez pas avec un nouveau régiment, votre armée est plus petite. « Montrer » les met tous deux en évidence."
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak Cliquez sur un pion pour prendre une pile.#!"
 MAAM_S_IDLE_TT:0 "Cliquez sur un pion pour prendre une pile, puis sur « Placer » d’un régiment du même type en vert. Le bouton fléché au bout de la ligne d’un régiment transfère des [soldiers|E] entre régiments du même type."
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak Cliquez sur un régiment pour le sélectionner.#!"
 MAAM_S_IDLE_TILES_TT:0 "Cliquez sur un régiment pour le sélectionner : sa fenêtre de régiment s’ouvre à gauche et les boutons ci-dessous agissent sur lui. « Demander » examine vos régiments pour vous conseiller."
 MAAM_S_IDLE_TITLE:0 "#weak Cliquez sur un pion pour déplacer une pile dans son titre.#!"
 MAAM_S_IDLE_TITLE_TT:0 "Cliquez sur un pion pour prendre une pile, puis sur « Placer » d’un régiment du même type et du même titre en vert. Le bouton fléché au bout de la ligne d’un régiment transfère des [soldiers|E]."
 MAAM_S_RES_RETRAINED:0 "@check_icon! [GetVariableSystem.Get( 'maam_rt_old_name' )] réentraîné en $MAAM_RT_NEW$ pour $MAAM_RT_P_RES$"
 MAAM_S_RES_FAILED:0 "#X Échec du réentraînement de [GetVariableSystem.Get( 'maam_rt_old_name' )].#! Rien n’a été dépensé."

 # Strip, row 2
 MAAM_S_RT_L:0 "1 emplacement réservé et régiments verrouillés jusqu’à la fin."
 MAAM_S_BLK_L:0 "Déplacer des piles, des [soldiers|E] ou réentraîner exige la paix et aucune armée levée."
 MAAM_S_LIFT_L:0 "Une pile par placement."
 MAAM_S_ENDED_L:0 "La fusion dissout le régiment. Définitif."
 MAAM_S_MERGE_L:0 "La fusion le dissout. « Fusionner ici » marque les régiments possibles."
 MAAM_S_RES_DONE_L:0 "Taille et [soldiers|E] conservés. Le nouveau régiment est rangé comme tout nouveau régiment."
 MAAM_S_RES_FAILED_L:0 "Tout achat de ce clic a été retiré et remboursé."
 MAAM_PREF_LIST:0 "Liste"
 MAAM_PREF_GROUPED:0 "Groupes"
 MAAM_PREF_TILES:0 "Vignettes"
 MAAM_PREF_SAVED:0 "Sauvé avec la partie."
 MAAM_BACK:0 "Ramener une pile ([GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0])"
 MAAM_BACK_TT:0 "Ramène la dernière pile placée dans le régiment d’où vous l’avez prise. Cliquez à nouveau pour annuler les placements précédents de cette prise (jusqu’à 10)."
 MAAM_DONE:0 "Terminé"
 MAAM_CANCEL:0 "Annuler"
 MAAM_PUT_DOWN:0 "Reposer"
 MAAM_PUT_DOWN_TT:0 "Termine la prise. Les piles déjà placées restent où elles sont."
 MAAM_ENDED_DONE_TT:0 "Garde la dernière pile comme régiment à part entière."
 MAAM_KEEP_IT:0 "Garder"
 MAAM_KEEP_IT_TT:0 "Garde le régiment. Rien n’est fusionné."
 MAAM_DESELECT_TT:0 "Désélectionner (ferme sa fenêtre de régiment)"
 MAAM_DISMISS_TT:0 "Fermer"
 MAAM_RT_CANCEL_TT:0 "Termine le réentraînement. Rien n’a été acheté ni réservé, donc rien n’est dépensé."

 # Moving soldiers
 MAAM_POUR_TT:0 "#T Transférer des soldats#!\nAssocie ce régiment à un autre du même type. Chaque clic déplace aussitôt jusqu’à une pile de [soldiers|E], dans un sens ou dans l’autre ; la première pile reste toujours pleine."
 MAAM_S_POUR_NONE:0 "Aucun autre régiment de ce type ne peut participer pour l’instant."
 MAAM_S_POUR_NONE_L:0 "Le transfert de soldats exige un second régiment du même type."
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "Envoyer [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] de [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] vers [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip].\n#weak Au plus une pile par clic ; l’expéditeur garde sa première pile pleine.#!"
 MAAM_POUR_TAKE_TT:0 "Envoyer [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] de [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] vers [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip].\n#weak Au plus une pile par clic ; l’expéditeur garde sa première pile pleine.#!"
 MAAM_POUR_NONE_TT:0 "#X Rien ne peut passer dans ce sens#!\nL’expéditeur garde sa première pile pleine, et le destinataire doit avoir de la place."
 MAAM_POUR_PREV_TT:0 "Associer au régiment précédent de ce type"
 MAAM_POUR_NEXT_TT:0 "Associer au régiment suivant de ce type"
 MAAM_POUR_BAR_TT:0 "#weak Bleu : la première pile, qui reste · or : [soldiers|E] transférables · rouge : place libre#!"
 MAAM_POUR_DONE_TT:0 "Termine le transfert de soldats. Tous les déplacements ont déjà eu lieu."

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T Taille [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E] [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak Le drapeau est l’étendard, chaque carré une pile. Or : [soldiers|E] · rouge : [soldiers|E] manquants · vide : place pour une autre pile.#!"
 MAAM_LANE_TITLE_TT:0 "Titre propriétaire : [Regiment.GetOwningTitle.GetName]\nTitre contrôleur : [Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I Cliquez sur le nom pour ouvrir la fenêtre du régiment#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak Verrouillé pendant un réentraînement.#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T Réentraînement#!\nCe régiment est en cours de réentraînement à l’arsenal."
 MAAM_BADGE_LOANED_TT:0 "#T Prêté#!\nPrêté à [Regiment.GetControllingTitle.GetNameNoTooltip]. Les modifications attendent son retour."
 MAAM_BADGE_UNRAISED_TT:0 "#T Non levé#!\nVous êtes en guerre et ce régiment n’est pas levé."
 MAAM_BADGE_UNSTATIONED_TT:0 "#T Non stationné#!\nCe régiment n’est stationné nulle part alors que vous avez des provinces qui pourraient l’accueillir."
 MAAM_TT_RETRAINING:0 "@alert_icon! #high En réentraînement#! à l’arsenal"
 MAAM_TT_LOANED:0 "@alert_icon! #high Prêté#! à [Regiment.GetControllingTitle.GetNameNoTooltip]"
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\nL’étendard : la première pile du régiment. Il ne bouge jamais seul ; « Fusion finale » fusionne tout le régiment dans un autre."
 MAAM_PIECE_LIFT_TT:0 "Prenez une pile, puis cliquez sur « Placer » d’un régiment du même type en surbrillance."
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "Reposer la pile"
 MAAM_PIECE_PLACE_TT:0 "Placer une pile ici"
 MAAM_PLACE:0 "Placer"
 MAAM_PLACE_TT:0 "Déplace une pile, avec jusqu’à une pile de [soldiers|E], dans ce régiment. Immédiat."
 MAAM_MERGE_HERE:0 "Fusionner ici"
 MAAM_MERGE_HERE_TT:0 "#X Fusion#!\nLa dernière pile et tous ses [soldiers|E] rejoignent ce régiment, et l’autre régiment est dissous.\n\n#weak Cette action est irréversible.#!"
 MAAM_LOWER_TT:0 "#X Fusion finale#!\nFusionne ce régiment dans un autre du même type. Les régiments qui peuvent l’accueillir affichent « Fusionner ici »."
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E] : [Regiment.CalcMenAliveCount] sur [Regiment.GetMaxCount]\n#weak Or : soldats · rouge : manquants. Barre pleine = effectif complet à cette taille.#!"
 MAAM_BLOCKED_TT:0 "#X Pas maintenant#!\nDéplacer des piles, des [soldiers|E] ou réentraîner exige la paix et aucune armée levée."
 MAAM_RETRAIN_TT:0 "Réentraîner en un autre type. Ouvre l’arsenal : cliquez sur un type pour voir ses frais exacts, puis sur « Réentraîner »."
 MAAM_RETRAIN_BLOCKED_TT:0 "#X Impossible de réentraîner ce régiment maintenant#!\nIl doit vous appartenir, être sous votre contrôle et non levé. Vous devez être en paix sans armée levée, et aucun autre réentraînement ne doit être en cours."
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "Fermez d’abord la fenêtre de recrutement."
 MAAM_RETRAIN_TITLE_TT:0 "#X Indisponible#!\nLes régiments de titre ne peuvent pas encore être réentraînés à l’arsenal."
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X Indisponible#!\nLe réentraînement exige la paix et aucune armée levée."
 MAAM_SEL_LIFT:0 "Prendre 1 pile"
 MAAM_SEL_POUR:0 "Transférer"
 MAAM_SEL_RETRAIN:0 "Réentraîner"
 MAAM_SEL_LOWER:0 "Fusion finale"
 MAAM_SEL_LIFT_TT:0 "#T Prendre une pile#!\nPrend une pile ; cliquez ensuite sur un régiment du même type en vert pour l’y placer. Immédiat."
 MAAM_SEL_LIFT_LONE_TT:0 "#X Il ne reste que la dernière pile#!\nUtilisez « Fusion finale » pour la fusionner dans un autre régiment du même type."
 MAAM_SEL_BLOCKED_TT:0 "#X Indisponible pour ce régiment pour l’instant#!"
 MAAM_SEL_NONE_TT:0 "Sélectionnez d’abord un régiment : cliquez sur sa vignette."
 MAAM_LOWER_BIG_TT:0 "#X Fusion finale#!\nSeulement quand il reste une pile. Déplacez d’abord ses autres piles vers des régiments du même type."
 MAAM_PAIRED:0 "Associé"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "régiments"
 MAAM_GROUP_REGIMENT:0 "régiment"
 MAAM_GROUP_FOLD_TT:0 "Replier ou afficher ce groupe"
 MAAM_GROUP_FROZEN_TT:0 "Les groupes restent tels quels pendant une action en cours."

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "Liste : l’ordre d’origine du jeu\n#weak Mémorisé pour la prochaine ouverture de la fenêtre Militaire.#!"
 MAAM_VIEW_GROUPED_TT:0 "Groupés par type, avec le nombre par type\n#weak Mémorisé pour la prochaine ouverture de la fenêtre Militaire.#!"
 MAAM_VIEW_TILES_TT:0 "Vignettes, comme dans le jeu de base\n#weak Mémorisé pour la prochaine ouverture de la fenêtre Militaire.#!"
 MAAM_VIEW_LOCKED_TT:0 "La vue reste fixe pendant une action en cours."
 MAAM_SETTINGS_TT:0 "Pas encore implémenté"

 # Quartermaster
 MAAM_QM_OPEN:0 "Voir le régiment"
 MAAM_QM_OPEN_TT:0 "Ouvre sa fenêtre de régiment, avec le bouton « Augmenter la taille » du jeu."
 MAAM_QM_SHOW:0 "Montrer"
 MAAM_QM_SHOW_TT:0 "Met les deux régiments en évidence."
 MAAM_QM_NEXT:0 "Suivant"
 MAAM_QM_ASK:0 "Demander"
 MAAM_QM_ASK_TT:0 "Réexamine vos régiments."
 MAAM_CREATE_BLOCKED_TT:0 "#X Pas pendant un réentraînement#!\nUn réentraînement occupe un emplacement de régiment temporaire. Terminez-le ou annulez-le d’abord."

 # Armory (recruitment window in retrain mode)
 MAAM_RT_PICKER_TITLE:0 "Réentraîner des hommes d’armes"
 MAAM_RT_CUR_INFO:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] piles · [Regiment.GetMAAType.GetBaseTypeName]"
 MAAM_RT_CUR_STATIONED:0 "#X Stationné en [Regiment.GetOriginProvince.GetName] :#! stationnez-le à nouveau ensuite."
 MAAM_RT_CUR_PRICE:0 " · $MAAM_RT_P_SRC$"
 MAAM_RT_CUR_PRICE_TT:0 "Votre prix par pile pour ce type, relevé à l’ouverture de l’arsenal. Les frais de réentraînement en sont déduits."
 MAAM_RT_CUR_UNLISTED:0 " · #X prix non relevé#!"
 MAAM_RT_CUR_UNLISTED_TT:0 "#T Pourquoi la moitié du nouveau prix#!\nÀ son ouverture (en pause), l’arsenal relève votre prix en achetant une pile de [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] puis en la remboursant. Ce n’était pas possible : [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] n’est plus dans votre liste de recrutement (ses conditions, comme une culture ou une innovation, ne sont plus remplies), ou la vérification n’a pas pu avoir lieu. Les frais valent donc la moitié du prix du nouveau type."
 MAAM_RT_CUR_REFUSED:0 " · #X pas en vente#!"
 MAAM_RT_CUR_REFUSED_TT:0 "#T Pourquoi la moitié du nouveau prix#!\nLes prix sont relevés en achetant une pile puis en la remboursant dans le même clic. Le jeu vient de refuser de vendre [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip], il n’y a donc aucun prix à relever. Les frais valent à la place la moitié du prix du nouveau type."
 MAAM_RT_CUR_NONGOLD:0 " · #X prix non relevé#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T Pourquoi la moitié du nouveau prix#!\nLes prix sont relevés en achetant une pile puis en la remboursant dans le même clic. L’achat de [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] a pris à la fois de l’or et du Trésor, son prix ne peut donc pas être isolé. Les frais valent à la place la moitié du prix par pile du nouveau type (le minimum s’applique toujours)."
 MAAM_RT_CUR_ROW:0 "[MenAtArmsType.GetNameNoTooltip] · votre type, relevé de son prix"
 MAAM_RT_CUR_ROW_TT:0 "Le type actuel de votre régiment. Son prix est relevé une fois à l’ouverture de l’arsenal (en pause) : une pile est achetée et remboursée aussitôt, puis cette ligne disparaît."
 MAAM_RT_CUR_UNKNOWN:0 " · #weak relevé du prix…#!"
 MAAM_RT_CUR_UNKNOWN_TT:0 "Votre prix pour ce type est relevé une fois à l’ouverture de l’arsenal, pendant que le jeu est en pause. Mettez le jeu en pause s’il n’apparaît pas."
 MAAM_RT_ROLE_ALL:0 "Tous"
 MAAM_RT_ROLE_ALL_TT:0 "Afficher tous les types possibles pour le réentraînement."
 MAAM_RT_ROLE_TT:0 "Afficher seulement [MenAtArmsType.GetBaseTypeName]"
 MAAM_RT_ROLE_ON_TT:0 "Afficher de nouveau tous les types"
 MAAM_RT_STACK_LINE:0 "[soldiers|E] par pile [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStackSize] → [MenAtArmsType.GetStackSize] : [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] sur [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] deviennent [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] sur [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]"
 MAAM_RT_STACK_LINE_TT:0 "#T Un autre nombre de [soldiers|E] par pile#!\nLe nouveau régiment garde sa taille et son taux de remplissage : [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] sur [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] [soldiers|E] deviennent [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] sur [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]. Les [soldiers|E] manquants reviennent par renforcement, comme d’habitude."
 MAAM_RT_PAUSE_FIRST:0 "#X Mettez le jeu en pause pour réentraîner.#! Les prix ne sont vérifiés qu’en pause."
 MAAM_RT_HINT:0 "Choisissez le type cible dans la liste."
 MAAM_RT_TGT_REFUSED:0 "#high [GetVariableSystem.Get( 'maam_rt_name' )]#! n’a pas pu être acheté. Rien n’a été dépensé."
 MAAM_RT_HEADER:0 "[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] → [GetVariableSystem.Get( 'maam_rt_name' )]"
 MAAM_RT_UPKEEP_LINE:0 "Maintenance par pile : [MenAtArmsType.GetFullStrengthMaintenanceCostForPlayerString]"
 MAAM_RT_UPKEEP_TT:0 "#T Maintenance par pile, effectif complet#!\n[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] : [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetFullStrengthMaintenanceCostForPlayerString]\n[MenAtArmsType.GetNameNoTooltip] : [MenAtArmsType.GetFullStrengthMaintenanceCostForPlayerString]"
 MAAM_RT_FEE_LABEL:0 "Frais de réentraînement"
 MAAM_RT_FEE_HOW:0 "$MAAM_RT_P_TGT$− $MAAM_RT_P_SRC$par pile, au moins [GetPlayer.Custom('maam_rt_cost_floor')], × [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount] piles"
 MAAM_RT_FEE_HOW_FALLBACK:0 "Moitié de $MAAM_RT_P_TGT$par pile, au moins [GetPlayer.Custom('maam_rt_cost_floor')], × [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount] piles"
 MAAM_RT_FEE_HOW_CONVERTED:0 "$MAAM_RT_P_TGT$− votre type [GetPlayer.Custom('maam_rt_cost_credit')] par pile, au moins [GetPlayer.Custom('maam_rt_cost_floor')], × [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount] piles"
 MAAM_RT_FEE_VALUE:0 "$MAAM_RT_P_FEE$"
 MAAM_RT_GO:0 "Réentraîner"
 MAAM_RT_NEED:0 "Il vous faut $MAAM_RT_P_FEE$"
 MAAM_RT_GO_TT:0 "Un seul clic : achète le nouveau type, reporte la taille et le remplissage en [soldiers|E], règle exactement ces frais, puis retire l’ancien régiment.\n\n#weak En cas d’échec, tout ce qui a été acheté dans ce clic est retiré et remboursé. Le stationnement n’est pas conservé.#!"
 MAAM_RT_FALLBACK_NOTE:0 "#weak Votre type actuel ne peut pas être acheté : les frais valent la moitié du nouveau prix.#!"
 MAAM_RT_CONVERTED_NOTE:0 "#weak Votre type actuel se paie dans une autre monnaie : son prix compte aux taux des hommes d’armes (1 or = [GetPlayer.MakeScope.ScriptValue('maam_rt_rate_piety_value')|1] piété = 2 prestige).#!"
 MAAM_RT_SHORT_NOTE:0 "#X Vous avez $MAAM_RT_P_HAVE$#!"
 MAAM_RT_UPFRONT_NOTE:0 "#X L’achat exige d’avance le prix du nouveau type :#! $MAAM_RT_P_TGT$pour une pile. La différence est rendue dans le même clic."
 MAAM_RT_RESELECTING:0 "#weak Sélection du type chiffré…#!"

 # Modifier
 maam_rt_slot_modifier:0 "Réentraînement d’hommes d’armes"
 maam_rt_slot_modifier_desc:0 "Un emplacement de régiment temporaire pendant que le Gestionnaire d’hommes d’armes relève les prix de réentraînement."

