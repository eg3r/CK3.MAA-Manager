 MAA_MANAGER_TITLE_WINDOW_TITLE:0 "Gestion des hommes d’armes de titre"
 MAA_MANAGER_TITLE_BUTTON_TOOLTIP:0 "Gérer les hommes d’armes de titre"
 MAA_MANAGER_TITLE_MODE_HINT:0 "Les transferts restent dans le même titre propriétaire. Les troupes prêtées sont en lecture seule."
 MAA_MANAGER_TITLE_REGIMENT_TOOLTIP:0 "Titre propriétaire : [Regiment.GetOwningTitle.GetName]\nTitre contrôleur : [Regiment.GetControllingTitle.GetName]"
 MAA_MANAGER_TITLE_RETRAIN_STATIONED:0 "#X Impossible de reconvertir un régiment stationné.#!\nRetirez d’abord son stationnement dans la fenêtre normale du régiment."
 MAA_MANAGER_TITLE_RETRAIN_UNAVAILABLE:0 "#X Reconversion de titre indisponible.#!\nLe titre doit pouvoir recruter le type cible, avec un emplacement libre et les fonds exigés par le jeu. Le régiment doit être sous votre contrôle et non stationné."
 MAA_MANAGER_TITLE_RETRAIN_FAILED:0 "#X La reconversion a échoué.#! Le régiment d’origine a été conservé et les prélèvements inattendus ont été remboursés."
 MAA_MANAGER_TITLE_COST_TREASURY_TOOLTIP:0 "Les coûts de base sont exprimés en équivalent or. Le coût habituel de reconversion est converti en Trésor.\nPar unité : [GetPlayer.MakeScope.ScriptValue('maa_manager_retrain_per_stack_cost')|0] [treasury|E]\nTotal : [GetPlayer.MakeScope.ScriptValue('maa_manager_retrain_gold_cost')|0] [treasury|E]"
 MAA_MANAGER_TITLE_EMPTY:0 "Vos titres ne possèdent aucun homme d’armes de titre."
 MAA_MANAGER_TITLE_RETRAIN_REQUIREMENTS:0 "Le titre doit pouvoir recruter le type cible, avec un emplacement libre et les fonds exigés par le jeu. Le régiment doit être sous votre contrôle et non stationné."
