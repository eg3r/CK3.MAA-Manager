l_spanish:
 # Order of Battle (Military window, Men-at-Arms area)
 MAAM_OB_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_OB_SEL:0 "#high [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_A:0 "#high [GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_SRC:0 "#high [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetNameNoTooltip]#!"
 MAAM_RT_NEW:0 "#high [GetPlayer.MakeScope.Var('maam_rt_result_new').Regiment.GetNameNoTooltip]#!"
 MAAM_QM_HEAD:0 "#high Intendente#! · "

 # Strip, row 1
 MAAM_S_SETTINGS:0 "#high Ajustes del tablero#! · Vista por defecto al abrir la ventana militar."
 MAAM_S_RT:0 "Reentrenando $MAAM_RT_SRC$. Elige el nuevo tipo a la izquierda."
 MAAM_S_WAR:0 "$MAAM_QM_HEAD$En guerra."
 MAAM_S_RAISED:0 "$MAAM_QM_HEAD$Hay un ejército reclutado."
 MAAM_S_LIFT:0 "Pila sacada de $MAAM_OB_SRC$. Pulsa Colocar en un regimiento en verde."
 MAAM_S_ENDED:0 "Solo queda la última pila de $MAAM_OB_SRC$."
 MAAM_S_ENDED_TT:0 "Solo queda la última pila de $MAAM_OB_SRC$. Los regimientos que pueden acogerla muestran el botón rojo Fusionar aquí; Listo la mantiene como regimiento propio."
 MAAM_S_MERGE:0 "Fusionando la última pila de $MAAM_OB_SRC$."
 MAAM_S_SEL:0 "$MAAM_OB_SEL$ #weak · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMAAChunkCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMaxMAAChunkCount] pilas · [GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_sel').Regiment.GetMaxCount] [soldiers|E]#!"
 MAAM_S_SEL_TT:0 "$MAAM_OB_SEL$ está seleccionado y su ventana de regimiento está abierta a la izquierda. Sus acciones están abajo; vuelve a hacer clic en su ficha o en la × para deseleccionarlo."
 MAAM_S_GROW:0 "$MAAM_QM_HEAD$$MAAM_QM_A$ tiene espacio para [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )] más."
 MAAM_S_GROW_TT:0 "$MAAM_QM_A$ puede crecer [Subtract_int32( GetPlayer.MakeScope.Var('maam_qm_a').Regiment.CalcMaxMAAChunkCount, GetPlayer.MakeScope.Var('maam_qm_a').Regiment.GetMAAChunkCount )] pilas más. Su ventana de regimiento indica si puedes aumentarlo ya."
 MAAM_S_COMBINE:0 "$MAAM_QM_HEAD$Dos regimientos de $MAAM_QM_A$ caben en uno."
 MAAM_S_COMBINE_TT:0 "Todas las plazas están ocupadas y dos regimientos de $MAAM_QM_A$ caben en uno. Combinarlos libera una plaza; hasta que la ocupes con un regimiento nuevo, tu ejército será menor. Mostrar resalta ambos."
 MAAM_S_IDLE:0 "$MAAM_QM_HEAD$#weak Clic en una pieza para sacar una pila.#!"
 MAAM_S_IDLE_TT:0 "Haz clic en una pieza de pila para sacarla y luego pulsa Colocar en un regimiento del mismo tipo iluminado en verde. El botón de flechas al final de la fila de un regimiento mueve [soldiers|E] entre regimientos del mismo tipo."
 MAAM_S_IDLE_TILES:0 "$MAAM_QM_HEAD$#weak Clic en un regimiento para seleccionarlo.#!"
 MAAM_S_IDLE_TILES_TT:0 "Haz clic en un regimiento para seleccionarlo: su ventana de regimiento se abre a la izquierda y los botones de abajo actúan sobre él. Revisar busca consejos entre tus regimientos."
 MAAM_S_IDLE_TITLE:0 "#weak Clic en una pieza para mover una pila dentro de su título.#!"
 MAAM_S_IDLE_TITLE_TT:0 "Haz clic en una pieza de pila para sacarla y luego pulsa Colocar en un regimiento del mismo tipo y título iluminado en verde. El botón de flechas al final de la fila de un regimiento mueve [soldiers|E]."
 MAAM_S_RES_RETRAINED:0 "@check_icon! [GetVariableSystem.Get( 'maam_rt_old_name' )] reentrenado como $MAAM_RT_NEW$ por $MAAM_RT_P_RES$"
 MAAM_S_RES_FAILED:0 "#X No se pudo reentrenar [GetVariableSystem.Get( 'maam_rt_old_name' )].#! No se ha gastado nada."

 # Strip, row 2
 MAAM_S_RT_L:0 "1 plaza reservada y regimientos bloqueados hasta terminar."
 MAAM_S_BLK_L:0 "Para mover pilas o [soldiers|E] y reentrenar, firma la paz y disuelve tus ejércitos."
 MAAM_S_LIFT_L:0 "Cada Colocar mueve una pila."
 MAAM_S_ENDED_L:0 "La fusión disuelve el regimiento. Es definitivo."
 MAAM_S_MERGE_L:0 "La fusión lo disuelve. Los regimientos aptos muestran Fusionar aquí."
 MAAM_S_RES_DONE_L:0 "Tamaño y [soldiers|E] conservados. Aparece donde el juego pone los regimientos nuevos."
 MAAM_S_RES_FAILED_L:0 "Todo lo comprado en ese clic se eliminó y se reembolsó."
 MAAM_PREF_LIST:0 "Lista"
 MAAM_PREF_GROUPED:0 "Grupos"
 MAAM_PREF_TILES:0 "Fichas"
 MAAM_PREF_SAVED:0 "Guardado en tu partida."
 MAAM_BACK:0 "Devolver una pila ([GetPlayer.MakeScope.Var('maam_hist_n').GetValue|0])"
 MAAM_BACK_TT:0 "Devuelve la última pila colocada al regimiento del que la sacaste. Vuelve a hacer clic para deshacer colocaciones anteriores de esta extracción (hasta 10)."
 MAAM_DONE:0 "Listo"
 MAAM_CANCEL:0 "Cancelar"
 MAAM_PUT_DOWN:0 "Soltar"
 MAAM_PUT_DOWN_TT:0 "Termina la extracción. Las pilas ya colocadas se quedan donde están."
 MAAM_ENDED_DONE_TT:0 "Mantiene la última pila como regimiento propio."
 MAAM_KEEP_IT:0 "Mantener"
 MAAM_KEEP_IT_TT:0 "Mantiene el regimiento. No se fusiona nada."
 MAAM_DESELECT_TT:0 "Deseleccionar (cierra su ventana de regimiento)"
 MAAM_DISMISS_TT:0 "Descartar"
 MAAM_RT_CANCEL_TT:0 "Termina el reentrenamiento. No se ha comprado ni retenido nada, así que no se gasta nada."

 # Moving soldiers
 MAAM_POUR_TT:0 "#T Mover soldados#!\nEmpareja este regimiento con otro del mismo tipo. Cada clic mueve al instante hasta una pila de [soldiers|E] en cualquier sentido; la primera pila siempre sigue completa."
 MAAM_S_POUR_NONE:0 "Ningún otro regimiento de este tipo puede participar ahora."
 MAAM_S_POUR_NONE_L:0 "Mover soldados requiere un segundo regimiento del mismo tipo."
 MAAM_POUR_PARTNER:0 "#high [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_PARTNER_N:0 "[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount]"
 MAAM_POUR_MAIN:0 "#high [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip]#!"
 MAAM_POUR_MAIN_N:0 "[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount]/[GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount]"
 MAAM_POUR_GIVE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_TAKE_N:0 "[Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )]"
 MAAM_POUR_GIVE_TT:0 "Enviar [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] de [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip] a [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip].\n#weak Como máximo una pila por clic; el que envía mantiene completa su primera pila.#!"
 MAAM_POUR_TAKE_TT:0 "Enviar [Max_int32( Min_int32( Min_int32( Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.CalcMenAliveCount, Divide_int32( GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetMAAChunkCount ) ) ), Subtract_int32( GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetMaxCount, GetPlayer.MakeScope.Var('maam_ob_src').Regiment.CalcMenAliveCount ) ), '(int32)0' )] [soldiers|E] de [GetPlayer.MakeScope.Var('maam_ob_tgt').Regiment.GetNameNoTooltip] a [GetPlayer.MakeScope.Var('maam_ob_src').Regiment.GetNameNoTooltip].\n#weak Como máximo una pila por clic; el que envía mantiene completa su primera pila.#!"
 MAAM_POUR_NONE_TT:0 "#X No se puede mover nada en este sentido#!\nEl que envía mantiene completa su primera pila y el que recibe necesita espacio."
 MAAM_POUR_PREV_TT:0 "Emparejar con el regimiento anterior de este tipo"
 MAAM_POUR_NEXT_TT:0 "Emparejar con el siguiente regimiento de este tipo"
 MAAM_POUR_BAR_TT:0 "#weak Azul: la primera pila, que se queda · dorado: [soldiers|E] que pueden moverse · rojo: espacio libre#!"
 MAAM_POUR_DONE_TT:0 "Deja de mover soldados. Todos los movimientos ya se han hecho."

 # Regiment rows and tiles
 MAAM_LANE_NUMBERS:0 "#T Tamaño [Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]#! · [soldiers|E] [Regiment.CalcMenAliveCount]/[Regiment.GetMaxCount]"
 MAAM_PIECES_TT:0 "$MAAM_LANE_NUMBERS$\n#weak La bandera es el estandarte; cada cuadro, una pila. Dorado: [soldiers|E] · rojo: [soldiers|E] que faltan · vacío: espacio para otra pila.#!"
 MAAM_LANE_TITLE_TT:0 "Título propietario: [Regiment.GetOwningTitle.GetName]\nTítulo que lo controla: [Regiment.GetControllingTitle.GetName]"
 MAAM_LANE_CLICK_HINT:0 "#I Clic en el nombre para abrir la ventana del regimiento#!"
 MAAM_LANE_LOCKED_HINT:0 "#weak Bloqueado durante el reentrenamiento.#!"
 MAAM_BADGE_RETRAINING_TT:0 "#T Reentrenando#!\nEste regimiento se está reentrenando en la armería."
 MAAM_BADGE_LOANED_TT:0 "#T Prestado#!\nPrestado a [Regiment.GetControllingTitle.GetNameNoTooltip]. Los cambios esperan a que vuelva."
 MAAM_BADGE_UNRAISED_TT:0 "#T No reclutado#!\nEstás en guerra y este regimiento no está reclutado."
 MAAM_BADGE_UNSTATIONED_TT:0 "#T Desacantonado#!\nEste regimiento no tiene acantonamiento aunque tienes provincias que podrían acogerlo."
 MAAM_TT_RETRAINING:0 "@alert_icon! #high Reentrenándose#! en la armería"
 MAAM_TT_LOANED:0 "@alert_icon! #high Prestado#! a [Regiment.GetControllingTitle.GetNameNoTooltip]"
 MAAM_COUNT:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount]"
 MAAM_STANDARD_TT:0 "$MAAM_LANE_NUMBERS$\nEl estandarte: la primera pila del regimiento. Nunca se mueve sola; Fusionar última pila fusiona todo el regimiento con otro."
 MAAM_PIECE_LIFT_TT:0 "Saca una pila y luego pulsa Colocar en un regimiento iluminado del mismo tipo."
 MAAM_PIECE_LIFT_NUM_TT:0 "$MAAM_LANE_NUMBERS$\n$MAAM_PIECE_LIFT_TT$"
 MAAM_PIECE_PUTDOWN_TT:0 "Soltar la pila"
 MAAM_PIECE_PLACE_TT:0 "Colocar una pila aquí"
 MAAM_PLACE:0 "Colocar"
 MAAM_PLACE_TT:0 "Mueve una pila, con hasta una pila de [soldiers|E], a este regimiento. Ocurre al instante."
 MAAM_MERGE_HERE:0 "Fusionar aquí"
 MAAM_MERGE_HERE_TT:0 "#X Fusionar#!\nLa última pila y todos sus [soldiers|E] se unen a este regimiento, y el otro regimiento se disuelve.\n\n#weak No se puede deshacer.#!"
 MAAM_LOWER_TT:0 "#X Fusionar última pila#!\nFusiona este regimiento con otro del mismo tipo. Los regimientos que pueden acogerlo muestran Fusionar aquí."
 MAAM_SOLDIER_BAR_TT:0 "[soldiers|E]: [Regiment.CalcMenAliveCount] de [Regiment.GetMaxCount]\n#weak Dorado: soldados · rojo: faltan. Barra llena = fuerza completa con este tamaño.#!"
 MAAM_BLOCKED_TT:0 "#X Ahora no#!\nPara mover pilas o [soldiers|E] y reentrenar, firma la paz y disuelve tus ejércitos."
 MAAM_RETRAIN_TT:0 "Reentrena el regimiento como otro tipo. Abre la armería: haz clic en un tipo para ver su tarifa exacta y luego pulsa Reentrenar."
 MAAM_RETRAIN_BLOCKED_TT:0 "#X Ahora no se puede reentrenar este regimiento#!\nDebe ser tuyo, estar bajo tu control y no estar reclutado. Debes estar en paz y sin nada reclutado, y no puede haber otro reentrenamiento abierto."
 MAAM_RETRAIN_PICKER_OPEN_TT:0 "Cierra primero la ventana de reclutamiento."
 MAAM_RETRAIN_TITLE_TT:0 "#X No disponible#!\nLos regimientos de título aún no se pueden reentrenar en la armería."
 MAAM_RETRAIN_UNSUPPORTED_TT:0 "#X No disponible#!\nReentrenar requiere paz y ningún ejército reclutado."
 MAAM_SEL_LIFT:0 "Sacar pila"
 MAAM_SEL_POUR:0 "Mover soldados"
 MAAM_SEL_RETRAIN:0 "Reentrenar"
 MAAM_SEL_LOWER:0 "Fusionar última pila"
 MAAM_SEL_LIFT_TT:0 "#T Sacar pila#!\nSaca una pila; luego haz clic en un regimiento del mismo tipo iluminado en verde para colocarla allí. Ocurre al instante."
 MAAM_SEL_LIFT_LONE_TT:0 "#X Solo queda la última pila#!\nUsa Fusionar última pila para fusionarla con otro regimiento del mismo tipo."
 MAAM_SEL_BLOCKED_TT:0 "#X Ahora no disponible para este regimiento#!"
 MAAM_SEL_NONE_TT:0 "Selecciona primero un regimiento: haz clic en su ficha."
 MAAM_LOWER_BIG_TT:0 "#X Fusionar última pila#!\nSolo cuando queda una pila. Antes, saca sus demás pilas y colócalas en regimientos del mismo tipo."
 MAAM_PAIRED:0 "Pareja"

 # Grouped view
 MAAM_GROUP_REGIMENTS:0 "regimientos"
 MAAM_GROUP_REGIMENT:0 "regimiento"
 MAAM_GROUP_FOLD_TT:0 "Plegar o mostrar este grupo"
 MAAM_GROUP_FROZEN_TT:0 "Los grupos no cambian mientras haya una acción abierta."

 # View buttons and settings
 MAAM_VIEW_LIST_TT:0 "Lista: el orden del propio juego\n#weak Se recuerda para la próxima vez que abras la ventana militar.#!"
 MAAM_VIEW_GROUPED_TT:0 "Grupos por tipo, con un recuento por tipo\n#weak Se recuerda para la próxima vez que abras la ventana militar.#!"
 MAAM_VIEW_TILES_TT:0 "Fichas, como en el juego base\n#weak Se recuerda para la próxima vez que abras la ventana militar.#!"
 MAAM_VIEW_LOCKED_TT:0 "La vista no cambia mientras haya una acción abierta."
 MAAM_SETTINGS_TT:0 "Aún no implementado"

 # Quartermaster
 MAAM_QM_OPEN:0 "Abrir regimiento"
 MAAM_QM_OPEN_TT:0 "Abre su ventana de regimiento, con el botón Aumentar tamaño del propio juego."
 MAAM_QM_SHOW:0 "Mostrar"
 MAAM_QM_SHOW_TT:0 "Resalta ambos regimientos."
 MAAM_QM_NEXT:0 "Siguiente"
 MAAM_QM_ASK:0 "Revisar"
 MAAM_QM_ASK_TT:0 "Vuelve a revisar tus regimientos."
 MAAM_CREATE_BLOCKED_TT:0 "#X No durante un reentrenamiento#!\nUn reentrenamiento ocupa una plaza temporal de regimiento. Termínalo o cancélalo primero."

 # Armory (recruitment window in retrain mode)
 MAAM_RT_PICKER_TITLE:0 "Reentrenar hombres de armas"
 MAAM_RT_CUR_INFO:0 "[Regiment.GetMAAChunkCount]/[Regiment.CalcMaxMAAChunkCount] pilas · [Regiment.GetMAAType.GetBaseTypeName]"
 MAAM_RT_CUR_STATIONED:0 "#X Acantonado en [Regiment.GetOriginProvince.GetName]:#! vuelve a acantonarlo tras reentrenar."
 MAAM_RT_CUR_PRICE:0 " · $MAAM_RT_P_SRC$"
 MAAM_RT_CUR_PRICE_TT:0 "Tu precio por pila de este tipo, leído al abrir la armería. Cada tarifa de reentrenamiento se calcula a partir de él."
 MAAM_RT_CUR_UNLISTED:0 " · #X precio no leído#!"
 MAAM_RT_CUR_UNLISTED_TT:0 "#T ¿Por qué la mitad del precio nuevo?#!\nAl abrirse (en pausa), la armería lee tu precio comprando una pila de [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] y reembolsándola. No fue posible: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] ya no está en tu lista de reclutamiento (ya no cumples sus requisitos, como una cultura o una innovación) o la comprobación no pudo hacerse. Por eso la tarifa es la mitad del precio del nuevo tipo."
 MAAM_RT_CUR_REFUSED:0 " · #X ahora no se vende#!"
 MAAM_RT_CUR_REFUSED_TT:0 "#T ¿Por qué la mitad del precio nuevo?#!\nLos precios se leen comprando una pila y reembolsándola en el mismo clic. El juego se ha negado a vender [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] ahora mismo, así que no hay precio que leer. Por eso la tarifa es la mitad del precio del nuevo tipo."
 MAAM_RT_CUR_NONGOLD:0 " · #X precio no leído#!"
 MAAM_RT_CUR_NONGOLD_TT:0 "#T ¿Por qué la mitad del precio nuevo?#!\nLos precios se leen comprando una pila y reembolsándola en el mismo clic. Comprar [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] costó oro y tesoro a la vez, así que no se puede separar su precio. Por eso la tarifa es la mitad del precio por pila del nuevo tipo (el mínimo sigue vigente)."
 MAAM_RT_CUR_ROW:0 "[MenAtArmsType.GetNameNoTooltip] · tu tipo, leyendo su precio"
 MAAM_RT_CUR_ROW_TT:0 "El tipo actual de tu regimiento. Su precio se lee una vez al abrir la armería (en pausa): se compra una pila y se reembolsa al instante; luego esta fila desaparece."
 MAAM_RT_CUR_UNKNOWN:0 " · #weak leyendo precio…#!"
 MAAM_RT_CUR_UNKNOWN_TT:0 "Tu precio para este tipo se lee una vez al abrir la armería, con el juego en pausa. Pausa el juego si no aparece."
 MAAM_RT_ROLE_ALL:0 "Todos"
 MAAM_RT_ROLE_ALL_TT:0 "Mostrar todos los tipos disponibles para reentrenar."
 MAAM_RT_ROLE_TT:0 "Mostrar solo [MenAtArmsType.GetBaseTypeName]"
 MAAM_RT_ROLE_ON_TT:0 "Volver a mostrar todos los tipos"
 MAAM_RT_STACK_LINE:0 "[soldiers|E] por pila [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetStackSize] → [MenAtArmsType.GetStackSize]: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] de [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] pasan a [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] de [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]"
 MAAM_RT_STACK_LINE_TT:0 "#T Otro número de [soldiers|E] por pila#!\nEl nuevo regimiento conserva su tamaño y su proporción de efectivos: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount] de [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount] [soldiers|E] pasan a [Divide_int32( Multiply_int32( GetPlayer.MakeScope.Var('maam_rt_source').Regiment.CalcMenAliveCount, Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount ) ), GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMaxCount )] de [Multiply_int32( MenAtArmsType.GetStackSize, GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAChunkCount )]. Los [soldiers|E] que faltan se reponen con los refuerzos habituales."
 MAAM_RT_PAUSE_FIRST:0 "#X Pausa el juego para reentrenar.#! Los precios solo se comprueban en pausa."
 MAAM_RT_HINT:0 "Elige en la lista el nuevo tipo para reentrenar."
 MAAM_RT_TGT_REFUSED:0 "No se pudo comprar #high [GetVariableSystem.Get( 'maam_rt_name' )]#!. No se ha gastado nada."
 MAAM_RT_HEADER:0 "[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip] → [GetVariableSystem.Get( 'maam_rt_name' )]"
 MAAM_RT_UPKEEP_LINE:0 "Mantenimiento por pila: [MenAtArmsType.GetFullStrengthMaintenanceCostForPlayerString]"
 MAAM_RT_UPKEEP_TT:0 "#T Mantenimiento por pila, con fuerza completa#!\n[GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetNameNoTooltip]: [GetPlayer.MakeScope.Var('maam_rt_source').Regiment.GetMAAType.GetFullStrengthMaintenanceCostForPlayerString]\n[MenAtArmsType.GetNameNoTooltip]: [MenAtArmsType.GetFullStrengthMaintenanceCostForPlayerString]"
 MAAM_RT_FEE_LABEL:0 "Tarifa de reentrenamiento"
